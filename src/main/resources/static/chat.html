<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的聊天</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff6a00',
            secondary: '#f5f5f5',
            dark: '#1a1a1a',
            light: '#888888',
            border: '#e8e8e8'
          }
        }
      }
    }
  </script>
  <style>
    .msg-left {
      background: #fff;
      border-radius: 6px 16px 16px 16px;
      padding: 10px 15px;
      max-width: 72%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      word-break: break-word;
      border: 1px solid #f0f0f0;
    }
    .msg-right {
      background: linear-gradient(135deg, #ff5e62, #ff6a00);
      color: #fff;
      border-radius: 16px 6px 16px 16px;
      padding: 10px 15px;
      max-width: 72%;
      box-shadow: 0 2px 10px rgba(255,94,98,0.25);
      word-break: break-word;
    }
    .contact-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; cursor: pointer;
      transition: all 0.15s;
      border-left: 3px solid transparent;
    }
    .contact-item:hover { background: #fff5f0; }
    .contact-item.active { background: #fff5f0; border-left-color: #ff6a00; }
    .contact-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; flex-shrink: 0;
      font-weight: 600;
    }
    .avatar-consumer { background: linear-gradient(135deg, #1890ff, #40a9ff); }
    .avatar-merchant { background: linear-gradient(135deg, #ff6a00, #ff9966); }
    .time-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 16px 0; color: #bbb; font-size: 12px;
    }
    .time-divider::before, .time-divider::after {
      content: ''; flex: 1; height: 1px; background: #eee;
    }
  </style>
</head>
<body class="bg-orange-50/30 min-h-screen">

<header class="bg-white border-b border-border sticky top-0 z-40">
  <div class="container mx-auto px-4 py-4 flex items-center">
    <a href="javascript:history.back()" class="text-primary font-bold text-lg flex items-center gap-2 hover:text-orange-600 transition-colors mr-4">
      <i class="fa fa-arrow-left"></i> 返回
    </a>
    <h1 class="text-dark text-xl font-bold">消息</h1>
  </div>
</header>

<main class="container mx-auto px-4 py-4">
  <div class="flex h-[calc(100vh-140px)] bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">

    <!-- 左侧联系人 -->
    <div class="w-80 border-r border-gray-100 flex flex-col flex-shrink-0">
      <div class="p-4 border-b border-gray-100">
        <h2 class="font-bold text-dark text-base">联系人</h2>
      </div>
      <div id="contactList" class="flex-1 overflow-y-auto">
        <div class="text-center text-light text-sm py-12">加载中...</div>
      </div>
    </div>

    <!-- 右侧聊天区 -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- 聊天头部 -->
      <div id="chatHeader" class="px-6 py-4 border-b border-gray-100 flex items-center gap-3 flex-shrink-0">
        <div id="headerAvatar" class="w-11 h-11 rounded-full bg-gray-200 flex items-center justify-center text-gray-400">
          <i class="fa fa-user text-lg"></i>
        </div>
        <div>
          <h3 id="chatTitle" class="font-semibold text-dark">请选择联系人</h3>
          <p id="chatSubtitle" class="text-xs text-light">在左侧选择一位联系人开始对话</p>
        </div>
      </div>

      <!-- 消息区 -->
      <div id="messageList" class="flex-1 overflow-y-auto px-6 py-4 space-y-3 bg-gray-50/50">
        <div class="text-center text-light text-sm py-12">
          <i class="fa fa-comments text-3xl text-gray-300 block mb-3"></i>
          选择一个联系人开始聊天
        </div>
      </div>

      <!-- 输入区 -->
      <div id="inputArea" class="p-4 border-t border-gray-100 flex gap-3 hidden flex-shrink-0">
        <input type="text" id="messageInput"
               class="flex-1 border-2 border-gray-100 rounded-xl px-5 py-3 focus:border-orange-400 focus:outline-none transition-colors bg-gray-50 text-sm"
               placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()"
                class="px-6 py-3 rounded-xl font-medium text-sm text-white transition-all"
                style="background:linear-gradient(135deg,#ff5e62,#ff6a00);box-shadow:0 2px 10px rgba(255,94,98,0.25);">
          <i class="fa fa-send mr-1"></i> 发送
        </button>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
  axios.defaults.baseURL = window.location.origin + '/taobao';
  var params = new URLSearchParams(window.location.search);
  var TARGET_MERCHANT = params.get('merchantId');
  var TARGET_CONSUMER = params.get('consumerId');
  var CURRENT_ROLE = null;
  var currentUserId = null;
  var currentUserName = null;
  var contacts = [];
  var activeContactId = null;
  var ws = null;

  document.addEventListener('DOMContentLoaded', async function() {
    await fetchMyInfo();
    await loadContacts();
    connectWebSocket();
    autoOpenTarget();
  });

  async function fetchMyInfo() {
    try {
      var resp = await axios.get('/consumer/me');
      if (resp.data.code === 200) {
        CURRENT_ROLE = 'consumer';
        currentUserId = resp.data.data.id;
        currentUserName = resp.data.data.consumer_name;
        return;
      }
    } catch(e) {}
    try {
      var resp = await axios.get('/merchant/myInfo');
      if (resp.data.code === 200) {
        CURRENT_ROLE = 'merchant';
        currentUserId = resp.data.data.id;
        currentUserName = resp.data.data.merchant_name;
        return;
      }
    } catch(e) {
      alert('请先登录');
      window.location.href = '/taobao/login.html';
    }
  }

  async function loadContacts() {
    try {
      var resp = await axios.get('/chat/contacts');
      if (resp.data.code === 200) contacts = resp.data.data || [];
      renderContactList();
    } catch(e) {}
  }

  function renderContactList() {
    var el = document.getElementById('contactList');
    if (!contacts.length) {
      el.innerHTML = '<div class="text-center text-light text-sm py-12"><i class="fa fa-users text-2xl text-gray-300 block mb-2"></i>暂无联系人</div>';
      return;
    }
    el.innerHTML = contacts.map(function(c) {
      var initial = (c.name || '?').charAt(0);
      var avatarClass = c.role === 'merchant' ? 'avatar-merchant' : 'avatar-consumer';
      var roleLabel = c.role === 'merchant' ? '商家' : '买家';
      var active = activeContactId === c.id ? ' active' : '';
      return '<div onclick="openChat(' + c.id + ',\'' + c.name + '\',\'' + c.role + '\')" class="contact-item' + active + '">' +
        '<div class="contact-avatar ' + avatarClass + '">' + initial + '</div>' +
        '<div class="flex-1 min-w-0">' +
          '<p class="font-medium text-dark text-sm truncate">' + c.name + '</p>' +
          '<p class="text-xs text-light">' + roleLabel + '</p>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function connectWebSocket() {
    if (!currentUserId) return;
    var wsHost = window.location.host;
    ws = new WebSocket('ws://' + wsHost + '/taobao/chat?userId=' + currentUserId + '&role=' + CURRENT_ROLE);
    ws.onopen = function() {
      setInterval(async function() { await loadContacts(); }, 10000);
    };
    ws.onmessage = function(event) {
      try {
        var msg = JSON.parse(event.data);
        if (activeContactId === msg.senderId) {
          appendMessage(msg.senderId, msg.senderRole, msg.content, new Date().toISOString());
          scrollToBottom();
        }
      } catch(e) {}
    };
  }

  function autoOpenTarget() {
    if (CURRENT_ROLE === 'consumer' && TARGET_MERCHANT) {
      var id = parseInt(TARGET_MERCHANT);
      var existing = contacts.find(function(c) { return c.id === id && c.role === 'merchant'; });
      if (existing) { openChat(existing.id, existing.name, existing.role); return; }
      axios.get('/chat/consumerNewChat', { params: { targetId: id } })
        .then(function(resp) {
          if (resp.data.code === 200) {
            var dto = resp.data.data;
            var nc = { id: dto.id, name: dto.name, role: dto.role };
            contacts.unshift(nc);
            renderContactList();
            openChat(nc.id, nc.name, nc.role);
          }
        });
    } else if (CURRENT_ROLE === 'merchant' && TARGET_CONSUMER) {
      var id = parseInt(TARGET_CONSUMER);
      var existing = contacts.find(function(c) { return c.id === id && c.role === 'consumer'; });
      if (existing) { openChat(existing.id, existing.name, existing.role); return; }
      axios.get('/chat/merchantNewChat', { params: { targetId: id } })
        .then(function(resp) {
          if (resp.data.code === 200) {
            var dto = resp.data.data;
            var nc = { id: dto.id, name: dto.name, role: dto.role };
            contacts.unshift(nc);
            renderContactList();
            openChat(nc.id, nc.name, nc.role);
          }
        });
    }
  }

  async function openChat(contactId, contactName, contactRole) {
    activeContactId = contactId;
    document.getElementById('chatTitle').innerText = contactName;
    document.getElementById('chatSubtitle').innerText = contactRole === 'merchant' ? '商家' : '买家';
    document.getElementById('inputArea').classList.remove('hidden');
    // 更新头像
    var avatar = document.getElementById('headerAvatar');
    avatar.innerHTML = (contactName || '?').charAt(0);
    avatar.className = 'w-11 h-11 rounded-full flex items-center justify-center text-white font-semibold text-lg ' + (contactRole === 'merchant' ? 'avatar-merchant' : 'avatar-consumer');
    document.getElementById('messageList').innerHTML = '';
    renderContactList();
    await loadHistory(contactId);
  }

  async function loadHistory(targetId) {
    try {
      var resp = await axios.get('/chat/conversation', { params: { userId1: currentUserId, userId2: targetId } });
      if (resp.data.code === 200 && resp.data.data) {
        resp.data.data.forEach(function(msg) {
          appendMessage(msg.sender_id, msg.sender_role, msg.content, msg.create_time);
        });
        scrollToBottom();
      }
    } catch(e) {}
  }

  function appendMessage(senderId, senderRole, content, time) {
    var isMine = (senderId === currentUserId && senderRole === CURRENT_ROLE);
    var div = document.createElement('div');
    div.className = 'flex ' + (isMine ? 'justify-end' : '');
    div.innerHTML =
      '<div class="' + (isMine ? 'msg-right' : 'msg-left') + '">' +
        '<p class="text-sm leading-relaxed">' + content + '</p>' +
        '<p class="text-xs mt-1 ' + (isMine ? 'opacity-70' : 'text-gray-400') + '">' + formatTime(time) + '</p>' +
      '</div>';
    document.getElementById('messageList').appendChild(div);
  }

  function sendMessage() {
    var input = document.getElementById('messageInput');
    var content = input.value.trim();
    if (!content || !activeContactId || !ws) return;
    var contact = contacts.find(function(c) { return c.id === activeContactId; }) || { role: 'merchant' };
    ws.send(JSON.stringify({
      senderId: currentUserId,
      senderRole: CURRENT_ROLE,
      receiverId: activeContactId,
      receiverRole: contact.role,
      content: content
    }));
    appendMessage(currentUserId, CURRENT_ROLE, content, new Date().toISOString());
    scrollToBottom();
    input.value = '';
  }

  function scrollToBottom() {
    var el = document.getElementById('messageList');
    el.scrollTop = el.scrollHeight;
  }

  function formatTime(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
</script>
</body>
</html>
