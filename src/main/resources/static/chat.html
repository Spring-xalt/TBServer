<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的聊天</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff4400',
            secondary: '#f5f5f5',
            dark: '#333333',
            light: '#666666',
            border: '#dddddd'
          }
        }
      }
    }
  </script>
  <style>
    .msg-left  { background:#f3f4f6; border-radius:8px; padding:8px 12px; max-width:70%; }
    .msg-right { background:#3b82f6; color:#fff; border-radius:8px; padding:8px 12px; max-width:70%; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-border">
  <div class="container mx-auto px-4 py-4 flex items-center">
    <a href="javascript:history.back()" class="text-primary text-xl font-bold mr-4">
      <i class="fa fa-arrow-left"></i> 返回
    </a>
    <h1 class="text-dark text-2xl font-bold">我的聊天</h1>
  </div>
</header>

<main class="container mx-auto px-4 py-4">
  <div class="flex h-[calc(100vh-140px)] bg-white rounded-lg shadow-sm overflow-hidden">

    <!-- ========= 左侧联系人列表 ========= -->
    <div class="w-72 border-r border-border flex flex-col">
      <div class="p-4 border-b border-border font-medium text-dark">联系人</div>
      <div id="contactList" class="flex-1 overflow-y-auto p-2 space-y-1">
        <div class="text-center text-light text-sm py-8">加载中...</div>
      </div>
    </div>

    <!-- ========= 右侧聊天窗口 ========= -->
    <div class="flex-1 flex flex-col">
      <!-- 聊天头部 -->
      <div id="chatHeader" class="p-4 border-b border-border flex items-center space-x-3">
        <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center">
          <i class="fa fa-user text-gray-500"></i>
        </div>
        <div>
          <h3 id="chatTitle" class="font-medium text-dark">请选择联系人</h3>
          <p id="chatSubtitle" class="text-xs text-light">在左侧选择一位联系人</p>
        </div>
      </div>

      <!-- 消息区域 -->
      <div id="messageList" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-center text-light text-sm py-8">选择一个联系人开始聊天</div>
      </div>

      <!-- 输入区域 -->
      <div id="inputArea" class="p-4 border-t border-border flex space-x-3 hidden">
        <input type="text" id="messageInput" class="flex-1 border border-border rounded-md px-4 py-2 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"
               placeholder="输入消息..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" class="px-6 py-2 bg-primary text-white rounded-md hover:bg-orange-600 transition-colors">
          发送
        </button>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>

  axios.defaults.baseURL = window.location.origin + '/taobao';


  // 解析 URL 参数
  const params = new URLSearchParams(window.location.search);

  const TARGET_MERCHANT = params.get('merchantId');  // 从商品卡片进来时会有

  let CURRENT_ROLE = null;
  let currentUserId   = null;
  let currentUserName = null;
  let contacts = [];
  let activeContactId = null;
  let ws = null;


  // ================= 初始化 =================
  document.addEventListener('DOMContentLoaded', async () => {
    await fetchMyInfo();
    await loadContacts();
    connectWebSocket();
    autoOpenTarget();
  });

  // 获取自己的 ID
  async function fetchMyInfo() {

    try {
      // 先尝试消费者
      let resp = await axios.get('/consumer/me');
      if (resp.data.code === 200) {
        CURRENT_ROLE = 'consumer';
        currentUserId = resp.data.data.id;
        currentUserName = resp.data.data.consumer_name;
        return;
      }
    } catch (e) {}

    try {
      // 再尝试商户
      let resp = await axios.get('/merchant/myInfo');
      if (resp.data.code === 200) {
        CURRENT_ROLE = 'merchant';
        currentUserId = resp.data.data.id;
        currentUserName = resp.data.data.merchant_name;
        return;
      }
    } catch (e) {
      alert('请先登录');
      window.location.href = '/taobao/login.html';
    }




  }

  //  加载联系人列表
  async function loadContacts() {
    try {
      const resp = await axios.get('/chat/contacts');
      if (resp.data.code === 200) {
        contacts = resp.data.data || [];
      }
      renderContactList();
    } catch (e) {
      console.error('加载联系人失败', e);
    }
  }

  function renderContactList() {
    const el = document.getElementById('contactList');
    if (!contacts.length) {
      el.innerHTML = '<div class="text-center text-light text-sm py-8">暂无联系人</div>';
      return;
    }
    el.innerHTML = contacts.map(c => `
            <div onclick="openChat(${c.id},'${c.name}','${c.role}')"
                 class="flex items-center space-x-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors
                        ${activeContactId===c.id ? 'bg-blue-50 border border-blue-200' : ''}">
                <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center">
                    <i class="fa fa-user text-gray-500"></i>
                </div>
                <div>
                    <p class="font-medium text-dark text-sm">${c.name}</p>
                    <p class="text-xs text-light">${c.role==='merchant'?'商家':'买家'}</p>
                </div>
            </div>
        `).join('');
  }

  // 3. WebSocket
  function connectWebSocket() {
    if (!currentUserId) return;

    const wsHost = window.location.host; // 自动获取当前页面的 IP:端口，如 10.102.30.109:8080
    ws = new WebSocket(`ws://${wsHost}/taobao/chat?userId=${currentUserId}&role=${CURRENT_ROLE}`);

    ws.onopen = () => {
      console.log('WebSocket 已连接');
      // 做个定时任务 每10s检测自己的联系人列表
      setInterval(async () => {
        await loadContacts();
        renderContactList();
      }, 10000);
    };

    ws.onerror = err => console.error('WebSocket 错误', err);
    ws.onclose = () => console.log('WebSocket 关闭');
    ws.onmessage = event => {
      try {

        const msg = JSON.parse(event.data);
        // 如果当前正好在和这个人聊天，直接展示
        if (activeContactId === msg.senderId) {
          appendMessage(msg.senderId, msg.senderRole, msg.content, new Date().toISOString());
          scrollToBottom();
        }
      } catch (e) {
        console.error('消息解析失败', e);
      }
    };
  }

  // 如果消费者从商品卡片进来，自动打开对应商户的聊天
  function autoOpenTarget() {

    if (CURRENT_ROLE !== 'consumer' || !TARGET_MERCHANT) return;
    const id = parseInt(TARGET_MERCHANT);

    // 检查是否已在联系人列表中
    const existing = contacts.find(c => c.id === id && c.role === 'merchant');
    if (existing) {
      openChat(existing.id, existing.name, existing.role);
      return;
    }

    // 不在列表中，调后端获取商户名称
    axios.get('/chat/consumerNewChat', { params: { targetId: id } })
            .then(resp => {
              if (resp.data.code === 200) {
                const dto = resp.data.data;
                const newContact = { id: dto.id, name: dto.name, role: dto.role };
                contacts.unshift(newContact);
                renderContactList();
                openChat(newContact.id, newContact.name, newContact.role);
              }
            })
            .catch(err => {
              console.error('获取商户信息失败', err);
            });


  }


  async function openChat(contactId, contactName, contactRole) {
    activeContactId = contactId;
    document.getElementById('chatTitle').innerText = contactName;
    document.getElementById('chatSubtitle').innerText = contactRole==='merchant'?'商家':'买家';
    document.getElementById('inputArea').classList.remove('hidden');
    document.getElementById('messageList').innerHTML = '';
    renderContactList();
    await loadHistory(contactId);
  }

  async function loadHistory(targetId) {
    try {
      const resp = await axios.get('/chat/conversation', {
        params: { userId1: currentUserId, userId2: targetId }
      });
      if (resp.data.code === 200 && resp.data.data) {
        resp.data.data.forEach(msg => appendMessage(
                msg.sender_id, msg.sender_role, msg.content, msg.create_time
        ));
        scrollToBottom();
      }
    } catch (e) {
      console.error('加载历史消息失败', e);
    }
  }

  function appendMessage(senderId, senderRole, content, time) {
    const isMine = (senderId === currentUserId && senderRole === CURRENT_ROLE);
    const div = document.createElement('div');
    div.className = `flex ${isMine ? 'justify-end' : ''}`;
    div.innerHTML = `
            <div class="${isMine ? 'msg-right' : 'msg-left'}">
                <p class="text-sm">${content}</p>
                <p class="text-xs mt-1 ${isMine ? 'text-blue-200' : 'text-gray-400'}">${formatTime(time)}</p>
            </div>
        `;
    document.getElementById('messageList').appendChild(div);

  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const content = input.value.trim();
    if (!content || !activeContactId || !ws) return;

    const contact = contacts.find(c => c.id === activeContactId) || { role: 'merchant' };
    const msg = {

      senderId: currentUserId,
      senderRole: CURRENT_ROLE,

      receiverId: activeContactId,
      receiverRole: contact.role,
      content: content

    };
    ws.send(JSON.stringify(msg));
    // 立即显示在自己的窗口
    appendMessage(currentUserId, CURRENT_ROLE, content, new Date().toISOString());
    scrollToBottom();
    input.value = '';
  }

  function scrollToBottom() {
    const el = document.getElementById('messageList');
    el.scrollTop = el.scrollHeight;
  }

  function formatTime(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
</script>
</body>
</html>
