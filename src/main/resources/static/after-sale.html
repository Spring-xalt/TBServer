<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的售后</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff6a00',
            secondary: '#f5f5f5',
            dark: '#1a1a1a',
            light: '#888888',
            border: '#e8e8e8'
          }
        }
      }
    }
  </script>
  <style>
    .refund-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: all 0.2s;
    }
    .refund-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.10); }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px;
      background: linear-gradient(135deg, #fafafa, #fff);
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px; color: #999;
    }
    .card-body {
      padding: 20px 22px;
      display: flex; gap: 16px; align-items: center;
    }
    .card-body .info { flex: 1; min-width: 0; }
    .card-body .info h3 { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .card-body .info .meta { font-size: 13px; color: #888; display: flex; gap: 16px; margin-top: 4px; }
    .card-body .price { text-align: right; flex-shrink: 0; }
    .card-body .price .amount { font-size: 20px; font-weight: 700; color: #ff5e62; }
    .status-badge { padding: 5px 14px; border-radius: 12px; font-size: 12.5px; font-weight: 600; }
    .status-1 { background: #fff7e6; color: #fa8c16; }
    .status-2 { background: #f0fff4; color: #52c41a; }
    .status-3 { background: #fff1f0; color: #ff4d4f; }
    .btn-sm { padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-sm-primary { background: linear-gradient(135deg, #ff5e62, #ff6a00); color: #fff; }
    .btn-sm-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-sm-blue { background: #1890ff; color: #fff; }
    .btn-sm-blue:hover { background: #1677cc; }
    .filter-btn { padding: 10px 22px; border-radius: 22px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1.5px solid #e8e8e8; transition: all 0.2s; background: #fff; color: #666; }
    .filter-btn.active { background: linear-gradient(135deg, #ff5e62, #ff6a00); color: #fff; border-color: transparent; }
    .filter-btn:hover:not(.active) { border-color: #ff6a00; color: #ff6a00; }
  </style>
</head>
<body class="bg-orange-50/30 min-h-screen">

<header class="bg-white border-b border-border sticky top-0 z-40">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a href="/taobao/index.html" class="text-primary font-bold text-lg flex items-center gap-2 hover:text-orange-600 transition-colors">
      <i class="fa fa-arrow-left"></i> 返回首页
    </a>
    <h1 class="text-dark text-xl font-bold">我的售后</h1>
    <div></div>
  </div>
</header>

<main class="container mx-auto px-4 py-8">
  <!-- Tab 切换 -->
  <div class="flex gap-2 mb-6 max-w-2xl mx-auto">
    <button class="filter-btn active" onclick="switchTab(0)" id="btnTab0">📋 可申请售后</button>
    <button class="filter-btn" onclick="switchTab(1)" id="btnTab1">📜 申请记录</button>
  </div>

  <div id="loading" class="text-center py-16">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
    <p class="text-light mt-4">加载中...</p>
  </div>

  <div id="tabOrders" class="hidden max-w-2xl mx-auto">
    <div id="orderList" class="space-y-4"></div>
    <div id="paginationAvail"></div>
  </div>

  <div id="tabHistory" class="hidden max-w-2xl mx-auto">
    <div id="historyList" class="space-y-4"></div>
    <div id="paginationHist"></div>
  </div>

  <div id="emptyState" class="hidden text-center py-16">
    <i class="fa fa-check-circle text-5xl text-gray-300 mb-4 block"></i>
    <p class="text-light text-lg">暂无需要售后的订单</p>
    <a href="/taobao/index.html" class="text-primary hover:underline mt-2 inline-block">去逛逛</a>
  </div>
</main>

<!-- 申请弹窗 -->
<div id="refundModal" class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center z-50 flex">
  <div class="bg-white rounded-2xl p-8 w-[460px] relative shadow-2xl">
    <button onclick="closeRefundModal()" class="absolute top-4 right-4 text-gray-400 hover:text-dark text-lg"><i class="fa fa-close"></i></button>
    <h2 class="text-xl font-bold text-dark mb-6">申请退换货</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-dark mb-1">商品名称</label>
        <input type="text" id="refundProductName" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 bg-gray-50 text-gray-600" disabled>
      </div>
      <div>
        <label class="block text-sm font-semibold text-dark mb-1">申请类型</label>
        <div class="flex gap-4">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="refundType" value="1" checked>
            <span>退货退款</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="refundType" value="2">
            <span>换货</span>
          </label>
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold text-dark mb-1">申请原因</label>
        <textarea id="refundReason" rows="3" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-orange-400 outline-none transition-colors" placeholder="请描述退换货原因..."></textarea>
      </div>
      <div class="flex justify-end gap-3 pt-4">
        <button onclick="closeRefundModal()" class="px-5 py-2.5 border border-gray-200 rounded-xl text-gray-500 hover:bg-gray-50">取消</button>
        <button onclick="submitRefund()" class="btn-sm btn-sm-primary">提交申请</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
  axios.defaults.baseURL = window.location.origin + '/taobao';
  var currentRefundOrderId = null;
  var currentTab = 0;
  var availableOrders = [];
  var refundHistory = [];
  var availPage = 1, availPages = 1;
  var histPage = 1, histPages = 1;
  var pageSize = 5;

  document.addEventListener('DOMContentLoaded', function() { loadData(1, 1); });

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('btnTab' + tab).classList.add('active');
    renderCurrentTab();
  }

  function renderCurrentTab() {
    var tab = currentTab;
    document.getElementById('tabOrders').classList.toggle('hidden', tab !== 0);
    document.getElementById('tabHistory').classList.toggle('hidden', tab !== 1);

    if (tab === 0) {
      var ol = document.getElementById('orderList');
      ol.innerHTML = '';
      if (availableOrders.length > 0) {
        availableOrders.forEach(function(o) { ol.appendChild(createOrderCard(o)); });
      } else {
        ol.innerHTML = '<p class="text-center text-light py-8">暂无可以申请售后的订单</p>';
      }
      renderPagination(availPage, availPages, 'avail');
    } else {
      var hl = document.getElementById('historyList');
      hl.innerHTML = '';
      if (refundHistory.length > 0) {
        refundHistory.forEach(function(r) { hl.appendChild(createHistoryCard(r)); });
      } else {
        hl.innerHTML = '<p class="text-center text-light py-8">暂无申请记录</p>';
      }
      renderPagination(histPage, histPages, 'hist');
    }

    if (availableOrders.length === 0 && refundHistory.length === 0) {
      document.getElementById('emptyState').classList.remove('hidden');
    }
  }

  function renderPagination(page, pages, type) {
    var id = type === 'avail' ? 'paginationAvail' : 'paginationHist';
    var container = document.getElementById(id);
    if (!container) return;
    if (pages <= 1) { container.innerHTML = ''; return; }
    var fn = type === 'avail' ? 'loadAvail' : 'loadHist';
    container.innerHTML =
      '<div class="flex items-center justify-center space-x-2 mt-6">' +
        '<button onclick="' + fn + '(' + (page - 1) + ')" class="px-3 py-2 border rounded-md text-sm ' + (page <= 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100') + '" ' + (page <= 1 ? 'disabled' : '') + '>上一页</button>' +
        '<span class="text-sm text-light">第 ' + page + ' / ' + pages + ' 页</span>' +
        '<button onclick="' + fn + '(' + (page + 1) + ')" class="px-3 py-2 border rounded-md text-sm ' + (page >= pages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100') + '" ' + (page >= pages ? 'disabled' : '') + '>下一页</button>' +
      '</div>';
  }

  function loadAvail(p) { loadData(p, histPage); }
  function loadHist(p) { loadData(availPage, p); }

  function loadData(availP, histP) {
    availPage = availP || 1;
    histPage = histP || 1;
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('emptyState').classList.add('hidden');

    Promise.all([
      axios.get('/refund/consumer/available-orders', { params: { page: availPage, size: pageSize } }),
      axios.get('/refund/consumer/list', { params: { page: histPage, size: pageSize } })
    ])
    .then(function(arr) {
      document.getElementById('loading').classList.add('hidden');
      var availResp = arr[0];
      var histResp = arr[1];

      // 可申请
      if (availResp.data.code === 200 && availResp.data.data) {
        availableOrders = availResp.data.data.orders || [];
        availPages = availResp.data.data.pages || 1;
      } else { availableOrders = []; availPages = 1; }

      // 申请记录
      if (histResp.data.code === 200 && histResp.data.data) {
        refundHistory = histResp.data.data.refunds || [];
        histPages = histResp.data.data.pages || 1;
      } else { refundHistory = []; histPages = 1; }

      renderCurrentTab();
    })
    .catch(function() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('emptyState').classList.remove('hidden');
    });
  }

  function createOrderCard(order) {
    var card = document.createElement('div');
    card.className = 'refund-card';
    card.innerHTML =
      '<div class="card-body">' +
        '<div class="info">' +
          '<h3>' + order.product_name + '</h3>' +
          '<div class="meta">' +
            '<span><i class="fa fa-store"></i> ' + (order.merchant_name || '商家未知') + '</span>' +
            '<span><i class="fa fa-clock-o"></i> ' + formatTime(order.create_time) + '</span>' +
          '</div>' +
          '<div class="meta" style="margin-top:6px;">' +
            '<span>实付 <b style="color:#ff5e62;">¥' + (order.total_amount || 0).toFixed(2) + '</b></span>' +
          '</div>' +
        '</div>' +
        '<button onclick="openRefundModal(' + order.id + ', \'' + order.product_name.replace(/'/g,"\\'") + '\')" class="btn-sm btn-sm-blue">申请退换货</button>' +
      '</div>';
    return card;
  }

  function createHistoryCard(r) {
    var typeMap = { 1: '📦 退货退款', 2: '🔄 换货' };
    var statusMap = { 1: { text: '⏳ 待审核', cls: 'status-1' }, 2: { text: '✅ 已同意', cls: 'status-2' }, 3: { text: '❌ 已拒绝', cls: 'status-3' } };
    var st = statusMap[r.status] || { text: '未知', cls: 'status-1' };
    var qty = r.quantity || 1;
    var unit = r.unitPrice || r.orderAmount || 0;
    var total = r.orderAmount || 0;

    var card = document.createElement('div');
    card.className = 'refund-card';
    card.innerHTML =
      '<div class="card-header">' +
        '<span>' + typeMap[r.type] + ' · 订单 #' + r.orderId + '</span>' +
        '<span class="status-badge ' + st.cls + '">' + st.text + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="info">' +
          '<h3>' + (r.productName || '商品未知') + '</h3>' +
          '<div class="meta">' +
            '<span><i class="fa fa-store"></i> ' + (r.merchantName || '商家未知') + '</span>' +
            '<span><i class="fa fa-clock-o"></i> ' + formatTime(r.createTime) + '</span>' +
          '</div>' +
          '<div class="meta" style="margin-top:6px;">' +
            (r.reason ? '<span><i class="fa fa-comment"></i> ' + r.reason + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="price">' +
          '<div style="font-size:13px;color:#999;">¥' + unit.toFixed(2) + ' × ' + qty + '</div>' +
          '<div class="amount">¥' + total.toFixed(2) + '</div>' +
        '</div>' +
      '</div>';
    return card;
  }

  function openRefundModal(orderId, productName) {
    currentRefundOrderId = orderId;
    document.getElementById('refundProductName').value = productName;
    document.getElementById('refundReason').value = '';
    document.querySelector('input[name="refundType"][value="1"]').checked = true;
    document.getElementById('refundModal').classList.remove('hidden');
  }

  function closeRefundModal() {
    document.getElementById('refundModal').classList.add('hidden');
    currentRefundOrderId = null;
  }

  function submitRefund() {
    var type = parseInt(document.querySelector('input[name="refundType"]:checked').value);
    var reason = document.getElementById('refundReason').value.trim();
    if (!reason) { alert('请填写申请原因'); return; }
    axios.post('/refund/apply', { orderId: currentRefundOrderId, type: type, reason: reason })
      .then(function(resp) {
        if (resp.data.code === 200) { alert('退换货申请已提交'); closeRefundModal(); loadData(); }
        else alert(resp.data.msg || '申请失败');
      })
      .catch(function() { alert('申请失败，请重试'); });
  }

  function formatTime(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
</script>
</body>
</html>
