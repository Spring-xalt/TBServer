<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>售后管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff6a00',
                        secondary: '#f5f5f5',
                        dark: '#1a1a1a',
                        light: '#888888',
                        border: '#e8e8e8'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-border">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/taobao/merchant-index.html" class="text-primary text-xl font-bold">
            <i class="fa fa-arrow-left mr-2"></i>返回商家中心
        </a>
        <h1 class="text-dark text-2xl font-bold">售后管理</h1>
        <div></div>
    </div>
</header>

<main class="container mx-auto px-4 py-8">
    <!-- 状态筛选标签 -->
    <div class="flex space-x-2 mb-6">
        <button onclick="filterRefunds(null)" id="btnAll" class="px-4 py-2 rounded-md bg-primary text-white">全部</button>
        <button onclick="filterRefunds(1)" id="btnPending" class="px-4 py-2 rounded-md border border-border text-dark hover:bg-gray-100">待审核</button>
        <button onclick="filterRefunds(2)" id="btnAgreed" class="px-4 py-2 rounded-md border border-border text-dark hover:bg-gray-100">已同意</button>
        <button onclick="filterRefunds(3)" id="btnRejected" class="px-4 py-2 rounded-md border border-border text-dark hover:bg-gray-100">已拒绝</button>
    </div>

    <!-- 加载提示 -->
    <div id="loading" class="text-center py-12 hidden">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
        <p class="text-light mt-4">加载中...</p>
    </div>

    <!-- 售后列表容器 -->
    <div id="refundList" class="space-y-4"></div>

    <!-- 空状态 -->
    <div id="emptyState" class="hidden text-center py-12">
        <i class="fa fa-check-circle text-5xl text-gray-300 mb-4"></i>
        <p class="text-light text-lg">暂无相关售后申请</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
    axios.defaults.baseURL = window.location.origin + '/taobao';

    document.addEventListener('DOMContentLoaded', () => loadRefunds());

    function loadRefunds(status = null) {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('refundList').innerHTML = '';
        document.getElementById('emptyState').classList.add('hidden');

        const params = status != null ? { status } : {};
        axios.get('/refund/merchant/list', { params })
            .then(resp => {
                document.getElementById('loading').classList.add('hidden');
                if (resp.data.code === 200 && resp.data.data && resp.data.data.length > 0) {
                    document.getElementById('refundList').classList.remove('hidden');
                    renderRefunds(resp.data.data);
                } else {
                    document.getElementById('emptyState').classList.remove('hidden');
                }
            })
            .catch(err => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyState').innerHTML =
                    '<i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>' +
                    '<p class="text-light">加载失败，请先登录</p>';
            });
    }

    function renderRefunds(refunds) {
        const listEl = document.getElementById('refundList');
        listEl.innerHTML = '';
        refunds.forEach(refund => {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-lg shadow-sm p-4 flex justify-between items-start';

            const typeText = refund.type === 1 ? '退货退款' : '换货';
            const statusMap = {
                1: { text: '待审核', color: 'bg-yellow-100 text-yellow-700' },
                2: { text: '已同意', color: 'bg-green-100 text-green-700' },
                3: { text: '已拒绝', color: 'bg-red-100 text-red-700' }
            };
            const st = statusMap[refund.status] || { text: '未知', color: 'bg-gray-100 text-gray-700' };

            let actionButtons = '';
            if (refund.status === 1) {
                actionButtons = `
                    <div class="mt-2 space-x-2">
                        <button onclick="auditRefund(${refund.id}, 'agree')" class="px-3 py-1 bg-green-500 text-white text-sm rounded hover:bg-green-600">同意</button>
                        <button onclick="auditRefund(${refund.id}, 'reject')" class="px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600">拒绝</button>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="flex-1">
                    <h3 class="font-medium text-dark">${typeText} - ${refund.productName}</h3>
                    <p class="text-light text-sm mt-1">消费者：${refund.consumerName}</p>
                    <p class="text-light text-sm mt-1">原因：${refund.reason || '无'}</p>
                    <p class="text-light text-sm mt-1">金额：¥${refund.orderAmount ? refund.orderAmount.toFixed(2) : '0.00'}</p>
                    <p class="text-light text-xs mt-1">申请时间：${formatTime(refund.createTime)}</p>
                </div>
                <div class="text-right">
                    <span class="inline-block px-2 py-1 rounded text-xs font-medium ${st.color}">${st.text}</span>
                    ${actionButtons}
                </div>
            `;
            listEl.appendChild(card);
        });
    }

    function filterRefunds(status) {
        ['btnAll', 'btnPending', 'btnAgreed', 'btnRejected'].forEach(id => {
            const btn = document.getElementById(id);
            btn.className = btn.className.replace('bg-primary text-white', 'border border-border text-dark hover:bg-gray-100');
        });
        const activeId = status === null ? 'btnAll' : (status === 1 ? 'btnPending' : (status === 2 ? 'btnAgreed' : 'btnRejected'));
        document.getElementById(activeId).className = document.getElementById(activeId).className.replace('border border-border text-dark hover:bg-gray-100', 'bg-primary text-white');
        loadRefunds(status);
    }

    function auditRefund(refundId, action) {
        const actionText = action === 'agree' ? '同意' : '拒绝';
        if (!confirm(`确定${actionText}该申请吗？`)) return;

        axios.put('/refund/audit', null, { params: { refundId, action } })
            .then(resp => {
                if (resp.data.code === 200) {
                    alert(resp.data.msg || '操作成功');
                    loadRefunds(); // 重新加载列表
                } else {
                    alert(resp.data.msg || '操作失败');
                }
            })
            .catch(err => {
                console.error('审核失败:', err);
                alert('审核失败，请重试');
            });
    }

    function formatTime(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
</script>
</body>
</html>
