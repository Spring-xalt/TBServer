<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仿淘宝 - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/taobao/style.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff4400',
            secondary: '#f5f5f5',
            dark: '#333333',
            light: '#666666',
            border: '#dddddd'
          },
          fontFamily: {
            sans: ['Microsoft YaHei', 'Arial', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .form-input-focus {
        @apply focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none;
      }
      .tab-active {
        @apply text-primary border-primary font-medium bg-primary/5;
      }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-border">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <div class="flex items-center">

      <a href="/taobao/index.html" class="text-primary text-2xl font-bold flex items-center">
        <i class="fa fa-shopping-bag mr-2"></i>
        <span>仿淘宝商城</span>
      </a>
    </div>
    <div class="transition-all duration-300 hover:scale-105">
      <span class="text-light">还没有账号？</span>
      <a href="/taobao/register.html" class="text-primary hover:underline ml-1 font-medium">
        立即注册
      </a>
    </div>
  </div>
</header>

<!-- 主内容区：登录表单 -->
<main class="container mx-auto px-4 py-8 md:py-12">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-sm overflow-hidden">
    <!-- 登录类型切换选项卡 -->
    <div class="border-b border-border">
      <div class="flex">


        <button id="consumerTab"
                class="tab-btn tab-active flex-1 py-4 px-6 text-center
                border-b-2 transition-all duration-300"
                data-role="consumer">
          消费者登录
        </button>

        <button id="merchantTab"
                class="tab-btn flex-1 py-4 px-6 text-center
                border-b-2 border-transparent text-light transition-all duration-300"
                data-role="merchant">
          商户登录
        </button>

        <button id="adminTab"
                class="tab-btn flex-1 py-4 px-6 text-center
                border-b-2 border-transparent text-light transition-all duration-300"
                data-role="admin">
          管理员登录
        </button>



      </div>
    </div>

    <!-- 消息提示 -->
    <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded m-4">
      <i class="fa fa-check-circle mr-2"></i>
      <span></span>
    </div>
    <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded m-4">
      <i class="fa fa-exclamation-circle mr-2"></i>
      <span></span>
    </div>


    <div class="p-6">
      <form id="loginForm" class="space-y-4">
        <input type="hidden" id="loginRole" value="consumer">

        <div>
          <label for="username" class="block text-dark text-sm font-medium mb-1">
            账号 <span class="text-red-500">*</span>
          </label>
          <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-light">
                                <i class="fa fa-user"></i>
                            </span>
            <input type="text" id="username"
                   class="w-full pl-10 pr-3 py-2 border border-border rounded-md form-input-focus"
                   placeholder="请输入账号" required>
          </div>
        </div>

        <div>
          <label for="password" class="block text-dark text-sm font-medium mb-1">
            密码 <span class="text-red-500">*</span>
          </label>
          <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-light">
                                <i class="fa fa-lock"></i>
                            </span>
            <input type="password" id="password"
                   class="w-full pl-10 pr-3 py-2 border border-border rounded-md form-input-focus"
                   placeholder="请输入密码" required>
            <button type="button" class="togglePassword absolute inset-y-0 right-0 flex items-center pr-3 text-light hover:text-primary">
              <i class="fa fa-eye"></i>
            </button>
          </div>
          <div class="flex justify-end mt-1">
            <a href="#" class="text-primary hover:underline text-sm">忘记密码？</a>
          </div>
        </div>

        <div class="pt-4">
          <button type="submit" class="w-full bg-primary hover:bg-orange-600 text-white font-medium py-3 px-4 rounded-md transition-colors duration-300 flex items-center justify-center transform hover:scale-[1.02] active:scale-[0.98]">
            <i class="fa fa-sign-in mr-2"></i>
            登录
          </button>
        </div>

        <div id="formRegisterLink" class="text-center mt-2">
          <span class="text-light">没有账号？</span>
          <a href="/taobao/register.html" class="text-primary hover:underline font-medium ml-1">
            去注册呗
          </a>
        </div>

        <!-- 游客登录按钮 -->
        <div class="pt-2">
          <button type="button" id="guestLoginBtn" class="w-full bg-gray-100 hover:bg-gray-200 text-dark font-medium py-3 px-4 rounded-md transition-colors duration-300 flex items-center justify-center transform hover:scale-[1.02] active:scale-[0.98]">
            <i class="fa fa-user-o mr-2"></i>
            游客登录
          </button>
        </div>
      </form>
    </div>
  </div>
</main>

<!-- 页脚 -->
<footer class="bg-white border-t border-border mt-12">
  <div class="container mx-auto px-4 py-8">
    <div class="text-center text-light text-sm">
      <p>© 2026 淘宝商城 版权所有</p>
      <p class="mt-2">联系方式：9109223xxx@eamil.ncu.edu.cn</p>
    </div>
  </div>
</footer>

<!-- 引入AXIOS -->
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>

  axios.defaults.baseURL = window.location.origin + '/taobao';
  axios.defaults.headers.post['Content-Type'] = 'application/json;charset=utf-8';

  // 页面元素
  const consumerTab = document.getElementById('consumerTab');
  const merchantTab = document.getElementById('merchantTab');
  const adminTab = document.getElementById('adminTab');
  const loginRoleInput = document.getElementById('loginRole');
  const guestLoginBtn = document.getElementById('guestLoginBtn');
  const formRegisterLink = document.getElementById('formRegisterLink');

  // 消息元素
  const successMessage = document.getElementById('successMessage');
  const errorMessage = document.getElementById('errorMessage');

  // 切换登录类型
  consumerTab.addEventListener('click', () => {
    setActiveTab('consumer');
  });

  merchantTab.addEventListener('click', () => {
    setActiveTab('merchant');
  });

  adminTab.addEventListener('click', () => {
    setActiveTab('admin');
  });

  // 设置活跃选项卡：新增管理员隐藏注册链接逻辑
  function setActiveTab(role) {
    hideMessages();

    // 移除所有选项卡的活跃状态
    [consumerTab, merchantTab, adminTab].forEach(tab => {
      tab.classList.remove('tab-active');
      tab.classList.add('text-light');
    });

    // 设置当前选项卡为活跃状态
    document.getElementById(`${role}Tab`).classList.add('tab-active');
    document.getElementById(`${role}Tab`).classList.remove('text-light');

    // 更新隐藏字段
    loginRoleInput.value = role;

    // 新增：管理员隐藏注册链接，消费者/商户显示
    if (role === 'admin') {
      formRegisterLink.classList.add('hidden');
    } else {
      formRegisterLink.classList.remove('hidden');
    }
  }

  // 密码显示/隐藏切换
  document.querySelector('.togglePassword').addEventListener('click', function() {
    const passwordInput = document.getElementById('password');
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);

    // 切换图标
    this.querySelector('i').classList.toggle('fa-eye');
    this.querySelector('i').classList.toggle('fa-eye-slash');
  });

  // 游客登录按钮点击事件：修复首页路径
  guestLoginBtn.addEventListener('click', function() {
    console.log('游客登录按钮触发，跳转路径：/taobao/index.html');
    window.location.href = '/taobao/index.html';
  });

  // 登录表单提交：接口路径已随baseURL自动适配
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const role = loginRoleInput.value;
    const loginData = {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value.trim()
    };

    try {
      const response = await axios.post(`/auth/${role}/login`, loginData);

      if (response.data.code == 200) {

          let targetUrl;
          if (role === 'merchant') {
            targetUrl = '/taobao/merchant-index.html';
          } else if(role === 'admin') {
            targetUrl = '/taobao/admin-index.html';
          }
          else{
            targetUrl='/taobao/index.html';
          }
          window.location.href = targetUrl;

      } else {
        showErrorMessage(response.data.message || '登录失败，请重试');
      }
    } catch (error) {
      console.error(`${role}登录失败:`, error);
      const errorMsg = error.response?.data?.message || '用户名或密码错误';
      showErrorMessage(`登录失败: ${errorMsg}`);
    }


  });

  // 显示成功消息
  function showSuccessMessage(message) {
    hideMessages();
    successMessage.querySelector('span').textContent = message;
    successMessage.classList.remove('hidden');
  }

  // 显示错误消息
  function showErrorMessage(message) {
    hideMessages();
    errorMessage.querySelector('span').textContent = message;
    errorMessage.classList.remove('hidden');
  }

  // 隐藏所有消息
  function hideMessages() {
    successMessage.classList.add('hidden');
    errorMessage.classList.add('hidden');
  }
</script>
</body>
</html>
