<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的购物车</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff6a00',
                        secondary: '#f5f5f5',
                        dark: '#1a1a1a',
                        light: '#888888',
                        border: '#e8e8e8'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 头部 -->
<header class="bg-white border-b border-border">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/taobao/index.html" class="text-primary text-xl font-bold">
            <i class="fa fa-shopping-bag mr-2"></i>返回首页
        </a>
        <h1 class="text-dark text-2xl font-bold">我的购物车</h1>
        <div></div>
    </div>
</header>

<!-- 主内容 -->
<main class="container mx-auto px-4 py-8">
    <div id="cartLoading" class="text-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
        <p class="text-light mt-4">加载中...</p>
    </div>

    <div id="cartEmpty" class="hidden text-center py-12">
        <i class="fa fa-shopping-cart text-5xl text-gray-300 mb-4"></i>
        <p class="text-light text-lg">购物车是空的</p>
        <a href="/taobao/index.html" class="text-primary hover:underline mt-2 inline-block">去逛逛</a>
    </div>

    <div id="cartContent" class="hidden">
        <div id="cartItems" class="space-y-4"></div>
        <div class="flex justify-end mt-8 space-x-4">


            <button onclick="clearCart()"
                    class="bg-gray-500 hover:bg-gray-600 text-white
                    font-bold py-3 px-6 rounded-md transition-colors">
                清空购物车
            </button>

            <button onclick="saveCart()"
                    class="bg-primary hover:bg-orange-600 text-white
                    font-bold py-3 px-8 rounded-md text-lg transition-colors">
                保存购物车
            </button>
            <button onclick="goPay()"
                    class="bg-green-500 hover:bg-green-600 text-white
                    font-bold py-3 px-8 rounded-md text-lg transition-colors">
                去支付
            </button>


        </div>
    </div>

    <div id="messageBox" class="hidden fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-md shadow-lg z-50"></div>

    <div id="payPasswordModal"
         class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center z-50 flex">
        <div class="bg-white rounded-lg p-6 w-[380px]">
            <h2 class="text-lg font-bold mb-3">确认支付</h2>
            <input type="password"
                   id="payPasswordInput"
                   class="w-full border rounded px-3 py-2 mb-4"
                   placeholder="请输入登录密码">
            <div class="flex justify-end space-x-2">
                <button onclick="document.getElementById('payPasswordModal').classList.add('hidden')"
                        class="px-4 py-2 border rounded">取消
                </button><button onclick="doPay()"
                                 class="px-6 py-2 bg-green-500 text-white rounded">确认</button>
            </div>
        </div>
    </div>





</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
    axios.defaults.baseURL = window.location.origin + '/taobao';

    document.addEventListener('DOMContentLoaded', loadCart);

    function loadCart() {
        document.getElementById('cartLoading').classList.remove('hidden');
        document.getElementById('cartEmpty').classList.add('hidden');
        document.getElementById('cartContent').classList.add('hidden');

        axios.get('/cart/list')
            .then(resp => {
                document.getElementById('cartLoading').classList.add('hidden');
                if (resp.data.code === 200 && resp.data.data.length > 0) {
                    renderCart(resp.data.data);
                } else {
                    document.getElementById('cartEmpty').classList.remove('hidden');
                }
            })
            .catch(err => {
                document.getElementById('cartLoading').classList.add('hidden');
                document.getElementById('cartEmpty').classList.remove('hidden');
                document.getElementById('cartEmpty').innerHTML =
                    '<i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>' +
                    '<p class="text-light">加载失败，请先登录</p>';
            });
    }

    function renderCart(items) {
        const container = document.getElementById('cartItems');
        container.innerHTML = '';

        items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'bg-white rounded-lg shadow-sm p-4 flex items-center justify-between';
            div.innerHTML = `
                <div class="flex-1">
                    <h3 class="font-medium text-dark">${item.productName}</h3>
                    <p class="text-light text-sm">商户：${item.merchantName}</p>
                    <p class="text-primary font-bold mt-1">¥${item.price ? item.price.toFixed(2) : '0.00'}</p>
                </div>
                <div class="flex items-center space-x-4">
                    <!-- 数量调节 -->
                    <div class="flex items-center space-x-1">

                        <button onclick="changeQty(${index}, ${item.quantity - 1})"
                            class="w-8 h-8 border border-border rounded bg-white
                             text-dark hover:bg-gray-100">−</button>


                        <span class="w-10 text-center">${item.quantity}</span>
                        <button onclick="changeQty(${index}, ${item.quantity + 1})"
                            class="w-8 h-8 border border-border rounded bg-white text-dark
                            hover:bg-gray-100">+</button>
                    </div>
                    <button onclick="deleteItem(${index})" class="text-red-500 hover:text-red-700 transition-colors">
                        <i class="fa fa-trash"></i> 删除
                    </button>
                </div>
            `;
            container.appendChild(div);
        });

        document.getElementById('cartContent').classList.remove('hidden');
    }

    // 修改数量
    function changeQty(index, newQty) {
        if (newQty < 1) {
            // 数量减到 0 以下 → 直接删除该项
            deleteItem(index);
            return;
        }
        // 正常更新数量
        axios.put('/cart/update', { index: index, quantity: newQty })
            .then(resp => {
                if (resp.data.code === 200) {
                    loadCart();
                    showMessage('数量已更新');
                } else {
                    alert(resp.data.msg || '操作失败');
                }
            })
            .catch(err => {
                console.error('更新失败:', err);
                alert('更新失败，请重试');
            });
    }

    // 删除一项
    function deleteItem(index) {
        if (!confirm('确定要删除这个商品吗？')) return;

        axios.delete('/cart/delete/' + index)
            .then(resp => {
                if (resp.data.code === 200) {
                    loadCart();
                    showMessage('已删除');
                } else {
                    alert(resp.data.msg || '删除失败');
                }
            })
            .catch(err => {
                console.error('删除失败:', err);
                alert('删除失败，请重试');
            });
    }

    // 清空购物车（未保存直接清 Session）
    function clearCart() {
        if (!confirm('确定清空购物车吗？未保存的修改将丢失！')) return;

        axios.delete('/cart/clear')
            .then(resp => {
                if (resp.data.code === 200) {
                    loadCart();
                    showMessage('购物车已清空');
                } else {
                    alert(resp.data.msg || '清空失败');
                }
            })
            .catch(err => {
                console.error('清空失败:', err);
                alert('清空失败，请重试');
            });
    }

    function saveCart() {
        axios.post('/cart/save')
            .then(resp => {
                if (resp.data.code === 200) {
                    showMessage('购物车已保存！');
                    // 保存后重新加载，可能清空（取决于后端 saveCart 后是否清空 Session）
                    // 我们之前设计是保存后清空 Session，所以重新加载会显示空
                    setTimeout(() => { window.location.href = '/taobao/index.html'; }, 1000);
                } else {
                    alert(resp.data.msg || '保存失败');
                }
            })
            .catch(err => {
                console.error('保存失败:', err);
                alert('保存失败，请重试');
            });
    }

    function showMessage(msg) {
        const box = document.getElementById('messageBox');
        box.innerText = msg;
        box.classList.remove('hidden');
        setTimeout(() => box.classList.add('hidden'), 2000);
    }


    function goPay() {
        document.getElementById('payPasswordModal').classList.remove('hidden');
        document.getElementById('payPasswordInput').value = '';
    }

    function closePayPasswordModal() {
        document.getElementById('payPasswordModal').classList.add('hidden');
    }

    function doPay() {
        const password = document.getElementById('payPasswordInput').value;
        if (!password) { alert('请输入密码'); return; }
        document.getElementById('payPasswordModal').classList.add('hidden');
        axios.post('/order/createAndPay', { password: password })
            .then(resp => {
                if (resp.data.code === 200) {
                    alert('支付成功！');
                    window.location.href = '/taobao/orders.html';
                } else {
                    alert(resp.data.msg || '支付失败');
                }
            })
            .catch(err => { alert('支付失败，请重试'); });
    }


</script>
</body>
</html>
