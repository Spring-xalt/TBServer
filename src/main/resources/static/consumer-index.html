<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仿淘宝商城 - 消费者首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/taobao/style.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff4400',
            secondary: '#f5f5f5',
            dark: '#333333',
            light: '#666666',
            border: '#dddddd'
          },
          fontFamily: {
            sans: ['Microsoft YaHei', 'Arial', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .product-card {
        @apply bg-white rounded-lg shadow-sm overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1;
      }
      .btn-primary {
        @apply bg-primary hover:bg-orange-600 text-white font-medium py-2 px-4 rounded-md transition-colors duration-300;
      }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
<!-- 顶部导航 -->
<header class="bg-white border-b border-border sticky top-0 z-50">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center py-4">
      <!-- 网站Logo -->
      <div class="flex items-center">
        <a href="/taobao/consumer-index.html" class="text-primary text-2xl font-bold flex items-center">
          <i class="fa fa-shopping-bag mr-2"></i>
          <span>仿淘宝商城</span>
        </a>
      </div>

      <!-- 搜索框 -->
      <div class="hidden md:block flex-1 max-w-xl mx-8">
        <div class="relative">
          <input id="navSearchInput" type="text" placeholder="搜索商品..."
                 class="w-full pl-4 pr-10 py-2 border border-border rounded-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
          <button onclick="searchProducts('nav')" class="absolute right-0 top-0 h-full px-4 text-primary hover:text-orange-600">
            <i class="fa fa-search"></i>
          </button>
        </div>
      </div>

      <!-- 用户操作区（消费者登录） -->
      <div class="flex items-center space-x-4">
        <div class="relative">
          <span id="accountBtn" class="text-dark hover:text-primary transition-colors cursor-pointer">
            <i class="fa fa-user-circle mr-1"></i>我的账户
          </span>
          <div id="accountMenu" class="absolute right-0 mt-2 w-48 bg-white shadow-md rounded-md py-2 hidden z-10">
            <a href="#" class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">个人中心</a>
            <a href="#" class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">我的订单</a>
            <div class="border-t border-gray-100 my-1"></div>
            <a href="#" onclick="logout()" class="block px-4 py-2 text-sm text-red-500 hover:bg-gray-100">退出登录</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- 主内容区 -->
<main class="container mx-auto px-4 py-8">
  <!-- 页面标题 -->
  <div class="mb-8">
    <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-dark">商品列表</h1>
    <p class="text-light mt-2">浏览我们的精选商品</p>
  </div>

  <!-- 产品列表 -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="productList">
    <!-- 产品卡片通过JS动态生成 -->
  </div>

  <!-- 加载提示 -->
  <div id="loadingIndicator" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
    <p class="ml-4 text-light">加载商品中...</p>
  </div>

  <!-- 无商品提示（默认隐藏） -->
  <div id="noProducts" class="hidden text-center py-12">
    <i class="fa fa-shopping-basket text-4xl text-gray-300 mb-4"></i>
    <p class="text-light">暂无商品可供展示</p>
  </div>
  <div id="profileModal" class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center z-50">
    <div class="bg-white rounded-lg p-6 w-[400px] relative">
      <h2 class="text-lg font-bold text-dark mb-4">个人中心</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-sm text-dark mb-1">用户名</label>
          <input type="text" id="profileUsername" class="w-full border border-border rounded px-3 py-2 bg-gray-100" disabled>
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">昵称</label>
          <input type="text" id="profileNickname" class="w-full border border-border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">账户余额</label>
          <input type="number" id="profileBalance" class="w-full border border-border rounded px-3 py-2" min="0" step="0.01">
        </div>
        <div class="flex justify-end space-x-2 mt-4">
          <button onclick="closeProfileModal()" class="px-4 py-2 border border-border rounded hover:bg-gray-100">取消</button>
          <button onclick="saveProfile()" class="px-4 py-2 bg-primary text-white rounded hover:bg-orange-600">保存修改</button>
        </div>
      </div>
      <button onclick="closeProfileModal()" class="absolute top-2 right-2 text-gray-500 hover:text-dark">
        <i class="fa fa-close"></i>
      </button>
    </div>
  </div>
</main>

<!-- 页脚 -->
<footer class="bg-white border-t border-border mt-12">
  <div class="container mx-auto px-4 py-8">
    <div class="text-center text-light text-sm">
      <p>© 2023 仿淘宝商城 版权所有</p>
      <p class="mt-2">联系方式：service@example.com</p>
    </div>
  </div>
</footer>

<!-- 引入AXIOS -->
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
  // 基础配置
  axios.defaults.baseURL = window.location.origin + '/taobao';
  axios.defaults.headers.post['Content-Type'] = 'application/json;charset=utf-8';

  document.addEventListener('DOMContentLoaded', function() {
    loadProducts();
  });

  // 下拉菜单点击切换显示
  const accountBtn = document.getElementById('accountBtn');
  const accountMenu = document.getElementById('accountMenu');

  accountBtn.addEventListener('click', () => {
    accountMenu.classList.toggle('hidden');
  });
  document.addEventListener('click', (e) => {
    if (!accountBtn.contains(e.target) && !accountMenu.contains(e.target)) {
      accountMenu.classList.add('hidden');
    }
  });

  // 加载产品列表
  function loadProducts() {
    const productListElement = document.getElementById('productList');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const noProductsElement = document.getElementById('noProducts');

    axios.get('/product/all')
            .then(resp => {
              loadingIndicator.classList.add('hidden');
              const body = resp.data;
              const products = Array.isArray(body) ? body : (body && (body.data || []));
              if (products && products.length > 0) {
                products.forEach(product => {
                  const productCard = createProductCard(product);
                  productListElement.appendChild(productCard);
                });
              } else {
                noProductsElement.classList.remove('hidden');
              }
            })
            .catch(err => {
              console.error('加载产品失败:', err);
              loadingIndicator.classList.add('hidden');
              noProductsElement.classList.remove('hidden');
              noProductsElement.innerHTML = `
          <i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>
          <p class="text-light">加载商品失败，请稍后重试</p>
        `;
            });
  }

  // 搜索商品
  function searchProducts(source) {
    const inputId = source === 'nav' ? 'navSearchInput' : 'searchInput';
    const keyword = document.getElementById(inputId).value.trim();
    const productListElement = document.getElementById('productList');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const noProductsElement = document.getElementById('noProducts');

    productListElement.innerHTML = '';
    noProductsElement.classList.add('hidden');
    loadingIndicator.classList.remove('hidden');

    axios.get('/product/search', { params: { keyword } })
            .then(resp => {
              loadingIndicator.classList.add('hidden');
              const body = resp.data;
              const products = Array.isArray(body) ? body : (body && (body.data || []));
              if (products && products.length > 0) {
                products.forEach(product => {
                  const productCard = createProductCard(product);
                  productListElement.appendChild(productCard);
                });
              } else {
                noProductsElement.classList.remove('hidden');
                noProductsElement.innerHTML = `
            <i class="fa fa-search text-4xl text-gray-300 mb-4"></i>
            <p class="text-light">没有找到相关商品</p>
          `;
              }
            })
            .catch(err => {
              console.error('搜索失败:', err);
              loadingIndicator.classList.add('hidden');
              noProductsElement.classList.remove('hidden');
              noProductsElement.innerHTML = `
          <i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>
          <p class="text-light">搜索失败，请稍后重试</p>
        `;
            });
  }

  // 创建产品卡片（立即购买）
  function createProductCard(product) {
    const card = document.createElement('div');
    card.className = 'product-card';
    const price = product.price ? product.price.toFixed(2) : '0.00';

    card.innerHTML = `
      <div class="relative">
        <img src="https://picsum.photos/seed/${product.id}/300/200" alt="${product.product_name}" class="w-full h-48 object-cover">
        ${product.stock <= 0 ? `
          <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
            <span class="text-white font-bold text-lg">已售罄</span>
          </div>` : ''}
      </div>
      <div class="p-4">
        <h3 class="font-medium text-dark line-clamp-1">${product.product_name}</h3>
        <p class="text-primary font-bold mt-2">¥${price}</p>
        <p class="text-light text-sm mt-1 line-clamp-2 h-10">${product.description || '暂无描述'}</p>
        <div class="mt-4">
          <button class="btn-primary w-full ${product.stock <= 0 ? 'opacity-50 cursor-not-allowed' : ''}"
                  ${product.stock <= 0 ? 'disabled' : `onclick="buyNow(${product.id})"`}>
            ${product.stock <= 0 ? '已售罄' : '立即购买'}
          </button>
        </div>
      </div>
    `;
    return card;
  }

  // 立即购买
  function buyNow(productId) {
    axios.get('/auth/status')
            .then(resp => {
              if (!resp.data.loggedIn) {
                window.location.href = `/taobao/login.html?redirect=/taobao/consumer-index.html`;
                return;
              }
              // 可跳转到购买页，示例：
              window.location.href = `/taobao/checkout.html?productId=${productId}`;
            })
            .catch(err => {
              console.error('操作失败:', err);
              alert('操作失败，请重试');
            });
  }
  let currentConsumerId = null;

  // 打开个人中心
  function openProfileModal() {
    document.getElementById('profileModal').classList.remove('hidden');
    loadConsumerProfile();
  }

  // 关闭个人中心
  function closeProfileModal() {
    document.getElementById('profileModal').classList.add('hidden');
  }

  // 加载个人信息
  function loadConsumerProfile() {
    axios.get('/consumer/me')
            .then(res => {
              const data = res.data.data;
              document.getElementById('profileUsername').value = data.username;
              document.getElementById('profileNickname').value = data.consumer_name;
              document.getElementById('profileBalance').value = data.account_balance;
            })
            .catch(err => {
              console.error(err);
              alert('未登录或获取信息失败，请重新登录');
              window.location.href = '/taobao/login.html?redirect=/taobao/consumer-index.html';
            });

  }

  // 保存修改（昵称/充值）
  function saveProfile() {
    const updatedData = {
      id: currentConsumerId,
      consumer_name: document.getElementById('profileNickname').value,
      account_balance: parseFloat(document.getElementById('profileBalance').value)
    };

    axios.put('/consumer/update', updatedData)
            .then(resp => {
              alert('修改成功');
              closeProfileModal();
              // 可刷新页面或更新前端余额显示
            })
            .catch(err => {
              console.error('更新失败:', err);
              alert('修改失败，请重试');
            });
  }

  // 给“个人中心”下拉菜单绑定点击事件
  document.querySelector('#accountMenu a:first-child').addEventListener('click', e => {
    e.preventDefault();
    openProfileModal();
  });
  // 退出登录
  function logout() {
    if (confirm('确定要退出登录吗？')) {
      axios.post('/auth/logout')
              .then(() => {
                window.location.href = '/taobao/index.html';
              })
              .catch(err => {
                console.error('退出登录失败:', err);
                alert('退出登录失败，请重试');
              });
    }
  }
</script>
</body>
</html>
