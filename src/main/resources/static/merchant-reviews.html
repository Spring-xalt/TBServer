<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺评价</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff4400',
                        secondary: '#f5f5f5',
                        dark: '#333333',
                        light: '#666666',
                        border: '#dddddd'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-border">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/taobao/merchant-index.html" class="text-primary text-xl font-bold">
            <i class="fa fa-arrow-left mr-2"></i>返回商家中心
        </a>
        <h1 class="text-dark text-2xl font-bold">店铺评价</h1>
        <div></div>
    </div>
</header>

<main class="container mx-auto px-4 py-8">
    <!-- 加载提示 -->
    <div id="loading" class="text-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
        <p class="text-light mt-4">加载中...</p>
    </div>

    <!-- 评价列表 -->
    <div id="reviewsList" class="hidden space-y-4 max-w-2xl mx-auto"></div>

    <!-- 空状态 -->
    <div id="emptyState" class="hidden text-center py-12">
        <i class="fa fa-star-o text-5xl text-gray-300 mb-4"></i>
        <p class="text-light text-lg">暂无评价</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
    axios.defaults.baseURL = window.location.origin + '/taobao';

    document.addEventListener('DOMContentLoaded', loadReviews);

    function loadReviews() {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('reviewsList').classList.add('hidden');
        document.getElementById('emptyState').classList.add('hidden');

        axios.get('/review/merchant/list')
            .then(resp => {
                document.getElementById('loading').classList.add('hidden');
                if (resp.data.code === 200 && resp.data.data && resp.data.data.length > 0) {
                    const reviews = resp.data.data;
                    const listEl = document.getElementById('reviewsList');
                    listEl.innerHTML = '';
                    reviews.forEach(review => {
                        listEl.appendChild(createReviewCard(review));
                    });
                    listEl.classList.remove('hidden');
                } else {
                    document.getElementById('emptyState').classList.remove('hidden');
                }
            })
            .catch(err => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyState').innerHTML =
                    '<i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>' +
                    '<p class="text-light">加载失败，请先登录</p>';
            });
    }

    function createReviewCard(review) {
        const starsHtml = Array.from({ length: 5 }, (_, i) =>
            `<i class="fa fa-star ${i < review.score ? 'text-orange-400' : 'text-gray-300'}"></i>`
        ).join('');

        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow-sm p-6';
        card.innerHTML = `
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="font-medium text-dark text-lg">${review.productName || '商品名称未知'}</h3>
                    <p class="text-light text-sm mt-1">
                        <i class="fa fa-user mr-1"></i>${review.consumerName || '匿名用户'}
                    </p>
                </div>
                <div class="flex space-x-1">${starsHtml}</div>
            </div>
            <p class="text-dark mt-4 text-sm">${review.content}</p>
            <p class="text-light text-xs mt-2">${formatTime(review.create_time)}</p>
        `;
        return card;
    }

    function formatTime(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
</script>
</body>
</html>
