<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺评价</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{primary:'#ff6a00',secondary:'#f5f5f5',dark:'#1a1a1a',light:'#888888',border:'#e8e8e8'}}}}</script>
    <style>
        .review-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); padding: 22px 24px; transition: all 0.2s; }
        .review-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.10); }
        .star-wrap { display: inline-flex; gap: 2px; }
        .star-wrap i { font-size: 18px; }
        .star-wrap i.on { color: #ff6a00; }
        .star-wrap i.off { color: #e0e0e0; }
    </style>
</head>
<body class="bg-orange-50/30 min-h-screen">

<header class="bg-white border-b border-border sticky top-0 z-40">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a href="/taobao/merchant-index.html" class="text-primary font-bold text-lg flex items-center gap-2 hover:text-orange-600 transition-colors">
      <i class="fa fa-arrow-left"></i> 返回商家中心
    </a>
    <h1 class="text-dark text-xl font-bold">店铺评价</h1>
    <div></div>
  </div>
</header>

<main class="container mx-auto px-4 py-8">
  <div id="loading" class="text-center py-16">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
    <p class="text-light mt-4">加载中...</p>
  </div>
  <div id="reviewsList" class="hidden space-y-4 max-w-2xl mx-auto"></div>
  <div id="pagination" class="max-w-2xl mx-auto"></div>
  <div id="emptyState" class="hidden text-center py-16">
    <i class="fa fa-star-o text-5xl text-gray-300 mb-4 block"></i>
    <p class="text-light text-lg">暂无评价</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
  axios.defaults.baseURL = window.location.origin + '/taobao';
  var reviewPage = 1, reviewPages = 1, pageSize = 5;
  document.addEventListener('DOMContentLoaded', function() { loadReviews(1); });

  function loadReviews(page) {
    reviewPage = page || 1;
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('pagination').innerHTML = '';
    axios.get('/review/merchant/list', { params: { page: reviewPage, size: pageSize } })
      .then(function(resp) {
        document.getElementById('loading').classList.add('hidden');
        var payload = resp.data.data;
        var reviews = (payload && payload.reviews) ? payload.reviews : [];
        reviewPages = (payload && payload.pages) ? payload.pages : 1;
        if (reviews.length > 0) {
          var listEl = document.getElementById('reviewsList');
          listEl.innerHTML = '';
          reviews.forEach(function(r) {
            var stars = '';
            for (var i = 1; i <= 5; i++) stars += '<i class="fa fa-star ' + (i <= r.score ? 'on' : 'off') + '"></i>';
            var card = document.createElement('div');
            card.className = 'review-card';
            card.innerHTML =
              '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
                '<div>' +
                  '<h3 style="font-size:16px;font-weight:600;color:#1a1a1a;">' + (r.productName || '商品未知') + '</h3>' +
                  '<p style="font-size:13px;color:#888;margin-top:4px;">' +
                    '<i class="fa fa-user"></i> ' + (r.consumerName || '匿名用户') +
                    ' · ' + formatTime(r.create_time) +
                  '</p>' +
                '</div>' +
                '<div class="star-wrap">' + stars + '</div>' +
              '</div>' +
              '<p style="font-size:14px;color:#555;margin-top:12px;line-height:1.7;">' + r.content + '</p>';
            listEl.appendChild(card);
          });
          listEl.classList.remove('hidden');
          renderPagination();
        } else {
          document.getElementById('emptyState').classList.remove('hidden');
        }
      })
      .catch(function() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
      });
  }

  function renderPagination() {
    var c = document.getElementById('pagination');
    if (reviewPages <= 1) { c.innerHTML = ''; return; }
    c.innerHTML =
      '<div class="flex items-center justify-center space-x-2 mt-6">' +
        '<button onclick="loadReviews(' + (reviewPage - 1) + ')" class="px-3 py-2 border rounded-md text-sm ' + (reviewPage <= 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100') + '" ' + (reviewPage <= 1 ? 'disabled' : '') + '>上一页</button>' +
        '<span class="text-sm text-light">第 ' + reviewPage + ' / ' + reviewPages + ' 页</span>' +
        '<button onclick="loadReviews(' + (reviewPage + 1) + ')" class="px-3 py-2 border rounded-md text-sm ' + (reviewPage >= reviewPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100') + '" ' + (reviewPage >= reviewPages ? 'disabled' : '') + '>下一页</button>' +
      '</div>';
  }

  function formatTime(d) {
    if (!d) return '';
    var t = new Date(d);
    return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0') + ' ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  }
</script>
</body>
</html>
