<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff6a00',
                        dark: '#1a1a1a',
                        light: '#888888',
                        border: '#e8e8e8'
                    }
                }
            }
        }
    </script>
    <style>
        .nav-link {
            display: flex; align-items: center;
            padding: 8px 16px; border-radius: 8px;
            font-size: 13.5px; font-weight: 500;
            color: #bbb; text-decoration: none;
            transition: all 0.2s; white-space: nowrap;
        }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .nav-link.active { background: #ff6a00; color: #fff; }
        .tab-content.hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- ========= 顶部横向导航栏 ========= -->
<header class="bg-dark text-white sticky top-0 z-40 shadow-md" style="display:flex; align-items:center; justify-content:space-between; padding:0 24px; min-height:56px;">
  <!-- 左侧 Logo -->
  <h1 style="font-size:18px; font-weight:700; white-space:nowrap; display:flex; align-items:center; gap:8px;">
    <i class="fa fa-cog" style="color:#ff6a00;"></i> 管理后台
  </h1>

  <!-- 中间导航 -->
  <nav style="display:flex; gap:4px;">
    <a href="#" onclick="switchTab('products')" class="nav-link active" id="nav-products">
      <i class="fa fa-shopping-bag mr-1.5"></i>商品
    </a>
    <a href="#" onclick="switchTab('consumers')" class="nav-link" id="nav-consumers">
      <i class="fa fa-users mr-1.5"></i>消费者
    </a>
    <a href="#" onclick="switchTab('merchants')" class="nav-link" id="nav-merchants">
      <i class="fa fa-store mr-1.5"></i>商户
    </a>
    <a href="#" onclick="switchTab('orders')" class="nav-link" id="nav-orders">
      <i class="fa fa-file-text mr-1.5"></i>订单
    </a>
    <a href="#" onclick="switchTab('dashboard')" class="nav-link" id="nav-dashboard">
      <i class="fa fa-dashboard mr-1.5"></i>数据大屏
    </a>
  </nav>

  <!-- 右侧退出 -->
  <div style="white-space:nowrap;">
    <button onclick="logout()" style="padding:8px 18px; border:1px solid #dc3545; color:#dc3545; border-radius:20px; font-size:13px; background:transparent; cursor:pointer; transition:all 0.2s;"
            onmouseover="this.style.background='#dc3545';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='#dc3545'">
      <i class="fa fa-sign-out mr-1.5"></i>退出登录
    </button>
  </div>
</header>

<!-- ========= 内容区 ========= -->
<main class="container mx-auto p-8">

    <!-- 商品概览 -->
    <div id="tab-products" class="tab-content">
        <h2 class="text-2xl font-bold text-dark mb-4">商品概览</h2>

        <!-- 筛选 + 排序栏 -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div id="productTypeFilters" class="flex gap-2 flex-wrap"></div>
            <select id="productOrderBy" onchange="loadProducts()"
                    class="px-3 py-2 border border-gray-300 rounded-lg text-sm text-dark bg-white focus:outline-none focus:border-primary">
                <option value="time">按上架时间 ↓</option>
                <option value="price">按价格 ↓</option>
            </select>
        </div>

        <!-- 商品卡片 -->
        <div id="productList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- 分页 -->
        <div id="productPagination" class="flex justify-center mt-6"></div>

        <div id="productLoading" class="text-center py-8 text-light hidden">加载中...</div>
    </div>

    <!-- 消费者概览 -->
    <div id="tab-consumers" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-dark mb-4">消费者概览</h2>

        <!-- 筛选栏 -->
        <div id="consumerFilters" class="flex gap-2 flex-wrap mb-4"></div>

        <!-- 表格 -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">用户名</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">昵称</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">余额</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">注册时间</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">状态</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">操作</th>
                </tr>
                </thead>
                <tbody id="consumerTableBody"></tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div id="consumerPagination" class="flex justify-center mt-6"></div>
    </div>

    <!-- 商户概览 -->
    <div id="tab-merchants" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-dark mb-4">商户概览</h2>

        <!-- 筛选栏 -->
        <div id="merchantFilters" class="flex gap-2 flex-wrap mb-4"></div>

        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">用户名</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">店铺名</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">营收</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">注册时间</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">状态</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">操作</th>
                </tr>
                </thead>
                <tbody id="merchantTableBody"></tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div id="merchantPagination" class="flex justify-center mt-6"></div>
    </div>

    <!-- 订单概览 -->
    <div id="tab-orders" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-dark mb-4">订单概览</h2>

        <!-- 筛选栏 -->
        <div id="orderFilters" class="flex gap-2 flex-wrap mb-4"></div>

        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">商品名</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">金额</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">状态</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-dark uppercase">创建时间</th>
                </tr>
                </thead>
                <tbody id="orderTableBody"></tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div id="orderPagination" class="flex justify-center mt-6"></div>
    </div>

    <!-- 数据大屏 -->
    <div id="tab-dashboard" class="tab-content hidden">
        <!-- KPI 卡片 -->
        <div class="grid grid-cols-1 mb-6">
            <div class="bg-white rounded-lg shadow-sm p-5 border-l-4 border-primary">
                <p class="text-light text-sm mb-1">今日交易额（已签收）</p>
                <p class="text-3xl font-bold text-primary" id="kpiTodayTotal">¥0.00</p>
            </div>
        </div>

        <!-- 订单分析 — 4组件，满宽 -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden flex flex-col mb-4" style="min-height:600px;">
            <div class="flex items-center justify-between px-4 py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white">
                <h3 class="font-bold"><i class="fa fa-bar-chart mr-2"></i>订单分析（4组件） <span class="text-xs bg-white/20 px-2 py-0.5 rounded ml-1">密码 671c</span></h3>
                <a href="http://localhost:37799/webroot/decision/link/RXzu" target="_blank"
                   class="text-xs text-blue-100 hover:text-white"><i class="fa fa-external-link mr-1"></i>新窗口打开</a>
            </div>
            <iframe src="http://localhost:37799/webroot/decision/link/RXzu"
                    class="flex-1 w-full border-0" allowfullscreen></iframe>
        </div>

        <!-- 退款分析 + 加购分析 — 各1组件，并排 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow-sm overflow-hidden flex flex-col" style="min-height:420px;">
                <div class="flex items-center justify-between px-4 py-3 bg-gradient-to-r from-red-500 to-red-600 text-white">
                    <h3 class="font-bold text-sm"><i class="fa fa-pie-chart mr-2"></i>退款分析 <span class="text-xs bg-white/20 px-2 py-0.5 rounded ml-1">密码 07b4</span></h3>
                    <a href="http://localhost:37799/webroot/decision/link/9XAJ" target="_blank"
                       class="text-xs text-red-100 hover:text-white"><i class="fa fa-external-link mr-1"></i>新窗口打开</a>
                </div>
                <iframe src="http://localhost:37799/webroot/decision/link/9XAJ"
                        class="flex-1 w-full border-0" allowfullscreen></iframe>
            </div>

            <div class="bg-white rounded-lg shadow-sm overflow-hidden flex flex-col" style="min-height:420px;">
                <div class="flex items-center justify-between px-4 py-3 bg-gradient-to-r from-green-500 to-green-600 text-white">
                    <h3 class="font-bold text-sm"><i class="fa fa-shopping-cart mr-2"></i>用户加购分析 <span class="text-xs bg-white/20 px-2 py-0.5 rounded ml-1">密码 87bd</span></h3>
                    <a href="http://localhost:37799/webroot/decision/link/AT3V" target="_blank"
                       class="text-xs text-green-100 hover:text-white"><i class="fa fa-external-link mr-1"></i>新窗口打开</a>
                </div>
                <iframe src="http://localhost:37799/webroot/decision/link/AT3V"
                        class="flex-1 w-full border-0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
    axios.defaults.baseURL = window.location.origin + '/taobao';
    let currentTab = 'products';

    document.addEventListener('DOMContentLoaded', () => {
        switchTab('products');
    });

    function switchTab(tab) {
        // 更新导航高亮
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
        document.getElementById('nav-' + tab).classList.add('active');
        // 切换内容区
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById('tab-' + tab).classList.remove('hidden');
        currentTab = tab;
        // 加载对应数据
        if (tab === 'products') { buildProductTypeFilters(); loadProducts(); }
        else if (tab === 'consumers') { buildConsumerFilters(); loadConsumers(); }
        else if (tab === 'merchants') { buildMerchantFilters(); loadMerchants(); }
        else if (tab === 'orders') { buildOrderFilters(); loadOrders(); }
        else if (tab === 'dashboard') loadDashboard();
    }

    // ========== 商品概览 ==========
    let productPage = 1, productPages = 1, productSize = 9;
    let currentProductType = '', currentProductOrderBy = 'time';

    function buildProductTypeFilters() {
        const types = ['', '数码电子', '服装鞋帽', '生活用品', '学习办公', '食品饮料', '美妆个护', '运动户外'];
        document.getElementById('productTypeFilters').innerHTML = types.map(t => {
            const label = t || '全部分类';
            const active = currentProductType === t;
            return `<span onclick="filterProductType('${t}')" class="px-3 py-1.5 rounded-full text-sm cursor-pointer border transition-colors ${active ? 'bg-primary text-white border-primary' : 'bg-white text-light border-gray-200 hover:border-primary hover:text-primary'}">${label}</span>`;
        }).join('');
    }

    function filterProductType(type) {
        currentProductType = type;
        productPage = 1;
        buildProductTypeFilters();
        loadProducts();
    }

    function loadProducts(pg) {
        if (pg) productPage = pg;
        const list = document.getElementById('productList');
        const loading = document.getElementById('productLoading');
        const pagination = document.getElementById('productPagination');
        list.innerHTML = '';
        pagination.innerHTML = '';
        loading.classList.remove('hidden');

        currentProductOrderBy = document.getElementById('productOrderBy').value;

        axios.get('/admin/products/paged', {
            params: {
                page: productPage,
                size: productSize,
                type: currentProductType || undefined,
                orderBy: currentProductOrderBy
            }
        }).then(resp => {
            loading.classList.add('hidden');
            if (resp.data.code === 200 && resp.data.data) {
                const d = resp.data.data;
                productPages = d.pages || 1;
                (d.records || []).forEach(p => list.appendChild(createProductCard(p)));
                renderProductPagination();
            }
        }).catch(() => {
            loading.classList.add('hidden');
            loading.innerHTML = '加载失败，请刷新重试';
        });
    }

    function renderProductPagination() {
        const pagination = document.getElementById('productPagination');
        if (productPages <= 1) { pagination.innerHTML = ''; return; }
        pagination.innerHTML = `
            <div class="flex items-center gap-2 text-sm">
                <button onclick="loadProducts(${productPage - 1})" ${productPage <= 1 ? 'disabled' : ''}
                    class="px-3 py-1.5 border rounded ${productPage <= 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">上一页</button>
                <span class="text-light">第 ${productPage} / ${productPages} 页</span>
                <button onclick="loadProducts(${productPage + 1})" ${productPage >= productPages ? 'disabled' : ''}
                    class="px-3 py-1.5 border rounded ${productPage >= productPages ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">下一页</button>
            </div>`;
    }

    function createProductCard(p) {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow-sm overflow-hidden';
        card.innerHTML = `
            <img src="/taobao/product/${p.id}/image" class="w-full h-40 object-cover"
                 onerror="this.src='https://picsum.photos/seed/${p.id}/300/200'">
            <div class="p-4">
                <h3 class="font-medium text-dark truncate">${p.product_name}</h3>
                <p class="text-primary font-bold mt-1">¥${p.price.toFixed(2)}</p>
                <p class="text-light text-sm mt-1">库存：${p.stock}</p>
                <p class="text-light text-sm mt-1">商户ID：${p.merchant_id}</p>
                <button onclick="deleteProduct(${p.id})" class="mt-2 px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600">删除</button>
            </div>
        `;
        return card;
    }

    function deleteProduct(id) {
        if (!confirm('确定删除该商品吗？')) return;
        axios.delete('/product/adminDelete/' + id)
            .then(resp => {
                if (resp.data.code === 200) {
                    alert('已删除');
                    loadProducts();
                } else {
                    alert(resp.data.msg || '删除失败');
                }
            })
            .catch(err => {
                console.error(err);
                alert('删除失败');
            });
    }

    // ========== 消费者概览 ==========
    // ========== 消费者概览 ==========
    let consumerPage = 1, consumerPages = 1, consumerSize = 5;
    let currentConsumerFilter = '';  // '' | 'high' | 'low' | 'disabled'

    function buildConsumerFilters() {
        const filters = [
            { v: '', label: '全部用户' },
            { v: 'high', label: '大额用户' },
            { v: 'low', label: '小额用户' },
            { v: 'disabled', label: '已禁用用户' }
        ];
        document.getElementById('consumerFilters').innerHTML = filters.map(f => {
            const active = currentConsumerFilter === f.v;
            return `<span onclick="filterConsumers('${f.v}')" class="px-3 py-1.5 rounded-full text-sm cursor-pointer border transition-colors ${active ? 'bg-primary text-white border-primary' : 'bg-white text-light border-gray-200 hover:border-primary hover:text-primary'}">${f.label}</span>`;
        }).join('');
    }

    function filterConsumers(filter) {
        currentConsumerFilter = filter;
        consumerPage = 1;
        buildConsumerFilters();
        loadConsumers();
    }

    function loadConsumers(pg) {
        if (pg) consumerPage = pg;
        const tbody = document.getElementById('consumerTableBody');
        const pagination = document.getElementById('consumerPagination');
        tbody.innerHTML = '';
        pagination.innerHTML = '';

        const params = { page: consumerPage, size: consumerSize };
        if (currentConsumerFilter === 'high') {
            params.status = 0;
            params.balanceMin = 500;
        } else if (currentConsumerFilter === 'low') {
            params.status = 0;
            params.balanceMax = 499;
        } else if (currentConsumerFilter === 'disabled') {
            params.status = 1;
        }

        axios.get('/admin/consumers/paged', { params }).then(resp => {
            if (resp.data.code === 200 && resp.data.data) {
                const d = resp.data.data;
                consumerPages = d.pages || 1;
                tbody.innerHTML = (d.records || []).map(c => `
                    <tr class="border-b border-border">
                        <td class="px-6 py-4">${c.id}</td>
                        <td class="px-6 py-4">${c.username}</td>
                        <td class="px-6 py-4">${c.consumer_name || '-'}</td>
                        <td class="px-6 py-4">¥${(c.account_balance || 0).toFixed(2)}</td>
                        <td class="px-6 py-4">${formatTime(c.create_time)}</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 rounded text-xs font-medium ${c.status === 1 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">${c.status === 1 ? '已禁用' : '正常'}</span></td>
                        <td class="px-6 py-4"><button onclick="toggleConsumer(${c.id})" class="px-3 py-1 rounded text-xs font-medium ${c.status === 1 ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'} text-white">${c.status === 1 ? '解禁' : '禁用'}</button></td>
                    </tr>
                `).join('');
                renderConsumerPagination();
            }
        });
    }

    function renderConsumerPagination() {
        const pagination = document.getElementById('consumerPagination');
        if (consumerPages <= 1) { pagination.innerHTML = ''; return; }
        pagination.innerHTML = `
            <div class="flex items-center gap-2 text-sm">
                <button onclick="loadConsumers(${consumerPage - 1})" ${consumerPage <= 1 ? 'disabled' : ''}
                    class="px-3 py-1.5 border rounded ${consumerPage <= 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">上一页</button>
                <span class="text-light">第 ${consumerPage} / ${consumerPages} 页</span>
                <button onclick="loadConsumers(${consumerPage + 1})" ${consumerPage >= consumerPages ? 'disabled' : ''}
                    class="px-3 py-1.5 border rounded ${consumerPage >= consumerPages ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">下一页</button>
            </div>`;
    }

    // ========== 商户概览 ==========
    let merchantPage = 1, merchantPages = 1, merchantSize = 5;
    let currentMerchantFilter = '';  // '' | 'hot' | 'plain' | 'disabled'

    function buildMerchantFilters() {
        const filters = [
            { v: '', label: '全部商户' },
            { v: 'hot', label: '热销商户' },
            { v: 'plain', label: '平销商户' },
            { v: 'disabled', label: '已停用商户' }
        ];
        document.getElementById('merchantFilters').innerHTML = filters.map(f => {
            const active = currentMerchantFilter === f.v;
            return `<span onclick="filterMerchants('${f.v}')" class="px-3 py-1.5 rounded-full text-sm cursor-pointer border transition-colors ${active ? 'bg-primary text-white border-primary' : 'bg-white text-light border-gray-200 hover:border-primary hover:text-primary'}">${f.label}</span>`;
        }).join('');
    }

    function filterMerchants(filter) {
        currentMerchantFilter = filter;
        merchantPage = 1;
        buildMerchantFilters();
        loadMerchants();
    }

    function loadMerchants(pg) {
        if (pg) merchantPage = pg;
        const tbody = document.getElementById('merchantTableBody');
        const pagination = document.getElementById('merchantPagination');
        tbody.innerHTML = '';
        pagination.innerHTML = '';

        const params = { page: merchantPage, size: merchantSize };
        if (currentMerchantFilter === 'hot') {
            params.status = 0;
            params.revenueMin = 5000;
        } else if (currentMerchantFilter === 'plain') {
            params.status = 0;
            params.revenueMax = 4999;
        } else if (currentMerchantFilter === 'disabled') {
            params.status = 1;
        }

        axios.get('/admin/merchants/paged', { params }).then(resp => {
            if (resp.data.code === 200 && resp.data.data) {
                const d = resp.data.data;
                merchantPages = d.pages || 1;
                tbody.innerHTML = (d.records || []).map(m => `
                    <tr class="border-b border-border">
                        <td class="px-6 py-4">${m.id}</td>
                        <td class="px-6 py-4">${m.username}</td>
                        <td class="px-6 py-4">${m.merchant_name || m.username}</td>
                        <td class="px-6 py-4">¥${(m.revenue || 0).toFixed(2)}</td>
                        <td class="px-6 py-4">${formatTime(m.create_time)}</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 rounded text-xs font-medium ${m.status === 1 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">${m.status === 1 ? '已禁用' : '正常'}</span></td>
                        <td class="px-6 py-4"><button onclick="toggleMerchant(${m.id})" class="px-3 py-1 rounded text-xs font-medium ${m.status === 1 ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'} text-white">${m.status === 1 ? '解禁' : '禁用'}</button></td>
                    </tr>
                `).join('');
                renderMerchantPagination();
            }
        });
    }

    function renderMerchantPagination() {
        const pagination = document.getElementById('merchantPagination');
        if (merchantPages <= 1) { pagination.innerHTML = ''; return; }
        pagination.innerHTML = `
            <div class="flex items-center gap-2 text-sm">
                <button onclick="loadMerchants(${merchantPage - 1})" ${merchantPage <= 1 ? 'disabled' : ''}
                    class="px-3 py-1.5 border rounded ${merchantPage <= 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">上一页</button>
                <span class="text-light">第 ${merchantPage} / ${merchantPages} 页</span>
                <button onclick="loadMerchants(${merchantPage + 1})" ${merchantPage >= merchantPages ? 'disabled' : ''}
                    class="px-3 py-1.5 border rounded ${merchantPage >= merchantPages ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">下一页</button>
            </div>`;
    }

    // ========== 订单概览 ==========
    let orderPage = 1, orderPages = 1, orderSize = 10;
    let currentOrderFilter = '';  // '' | 'large' | 'small'

    function buildOrderFilters() {
        const filters = [
            { v: '', label: '全部订单' },
            { v: 'large', label: '大额订单' },
            { v: 'small', label: '小额订单' }
        ];
        document.getElementById('orderFilters').innerHTML = filters.map(f => {
            const active = currentOrderFilter === f.v;
            return `<span onclick="filterOrders('${f.v}')" class="px-3 py-1.5 rounded-full text-sm cursor-pointer border transition-colors ${active ? 'bg-primary text-white border-primary' : 'bg-white text-light border-gray-200 hover:border-primary hover:text-primary'}">${f.label}</span>`;
        }).join('');
    }

    function filterOrders(filter) {
        currentOrderFilter = filter;
        orderPage = 1;
        buildOrderFilters();
        loadOrders();
    }

    function loadOrders(pg) {
        if (pg) orderPage = pg;
        const tbody = document.getElementById('orderTableBody');
        const pagination = document.getElementById('orderPagination');
        tbody.innerHTML = '';
        pagination.innerHTML = '';

        const params = { page: orderPage, size: orderSize };
        if (currentOrderFilter) params.amountRange = currentOrderFilter;

        axios.get('/admin/orders/paged', { params }).then(resp => {
            if (resp.data.code === 200 && resp.data.data) {
                const d = resp.data.data;
                const statusMap = {1:'未支付',2:'已支付',3:'已签收'};
                orderPages = d.pages || 1;
                tbody.innerHTML = (d.records || []).map(o => `
                    <tr class="border-b border-border">
                        <td class="px-6 py-4">${o.id}</td>
                        <td class="px-6 py-4">${o.product_name}</td>
                        <td class="px-6 py-4">¥${(o.total_amount || 0).toFixed(2)}</td>
                        <td class="px-6 py-4">${statusMap[o.status] || '未知'}</td>
                        <td class="px-6 py-4">${formatTime(o.create_time)}</td>
                    </tr>
                `).join('');
                renderOrderPagination();
            }
        });
    }

    function renderOrderPagination() {
        const pagination = document.getElementById('orderPagination');
        if (orderPages <= 1) { pagination.innerHTML = ''; return; }
        pagination.innerHTML = `
            <div class="flex items-center gap-2 text-sm">
                <button onclick="loadOrders(${orderPage - 1})" ${orderPage <= 1 ? 'disabled' : ''}
                    class="px-3 py-1.5 border rounded ${orderPage <= 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">上一页</button>
                <span class="text-light">第 ${orderPage} / ${orderPages} 页</span>
                <button onclick="loadOrders(${orderPage + 1})" ${orderPage >= orderPages ? 'disabled' : ''}
                    class="px-3 py-1.5 border rounded ${orderPage >= orderPages ? 'opacity-30 cursor-not-allowed' : 'hover:bg-gray-100'}">下一页</button>
            </div>`;
    }

    // ========== 数据大屏 ==========
    function loadDashboard() {
        axios.get('/admin/today-total').then(resp => {
            if (resp.data.code === 200) {
                document.getElementById('kpiTodayTotal').innerText = '¥' + (resp.data.data || 0).toFixed(2);
            }
        });
    }

    // ========== 禁用/解禁 ==========
    function toggleConsumer(id) {
        if (!confirm('确定要切换该消费者状态吗？')) return;
        axios.put('/admin/consumer/' + id + '/toggle')
            .then(resp => {
                if (resp.data.code === 200) {
                    alert(resp.data.msg || '操作成功');
                    loadConsumers();
                } else {
                    alert(resp.data.msg || '操作失败');
                }
            })
            .catch(err => {
                console.error(err);
                alert('操作失败');
            });
    }

    function toggleMerchant(id) {
        if (!confirm('确定要切换该商户状态吗？')) return;
        axios.put('/admin/merchant/' + id + '/toggle')
            .then(resp => {
                if (resp.data.code === 200) {
                    alert(resp.data.msg || '操作成功');
                    loadMerchants();
                } else {
                    alert(resp.data.msg || '操作失败');
                }
            })
            .catch(err => {
                console.error(err);
                alert('操作失败');
            });
    }

    // ========== 退出 ==========
    function logout() {
        if (confirm('确定退出吗？')) {
            axios.post('/auth/logout')
                .then(() => { window.location.href = '/taobao/login.html'; });
        }
    }

    function formatTime(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
</script>
</body>
</html>
