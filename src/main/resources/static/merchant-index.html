<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商家中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff6a00',
            secondary: '#f5f5f5',
            dark: '#1a1a1a',
            light: '#888888',
            border: '#e8e8e8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-border">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <!-- 左侧 Logo -->
    <a href="/taobao/merchant-index.html" class="text-primary text-2xl font-bold flex items-center">
      <i class="fa fa-shopping-bag mr-2"></i>
      <span>商家中心</span>
    </a>

    <!-- 中间搜索框（暂时禁用） -->
    <div class="hidden md:block flex-1 max-w-xl mx-8">
      <div class="relative">

        <input id="searchInput" type="text" placeholder="搜索我的商品..."
               class="w-full pl-4 pr-10 py-2 border border-border rounded-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"
               onkeydown="if(event.key === 'Enter') searchMyProducts()">
        <button onclick="searchMyProducts()" class="absolute right-0 top-0 h-full px-4 text-primary hover:text-orange-600">
          <i class="fa fa-search"></i>
        </button>



      </div>
    </div>

    <!-- 右侧商家账户下拉菜单（点击切换 ）-->
    <div class="relative group">


            <span onclick="toggleMerchantMenu()" class="text-dark hover:text-primary cursor-pointer">
                <i class="fa fa-user-circle mr-1"></i>商家账户
            </span>


      <div id="merchantDropdown" class="absolute right-0 mt-2 w-48 bg-white shadow-md rounded-md py-2 hidden z-10">

        <a href="/taobao/merchant-profile.html"
           class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">账户设置</a>

        <a href="/taobao/merchant-reviews.html"
           class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">店铺评价</a>

        <a href="/taobao/merchant-orders.html"
           class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">我的订单</a>

        <a href="/taobao/chat.html"
           class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">我的咨询</a>

        <a href="/taobao/merchant-after-sale.html"
           class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">售后管理</a>




        <div class="border-t border-gray-100 my-1"></div>

        <a href="#" onclick="logout()" class="block px-4 py-2 text-sm text-red-500 hover:bg-gray-100">退出登录</a>

      </div>
    </div>
  </div>
</header>

<!-- 主内容区 -->
<main class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-dark">我的商品</h1>
    <button onclick="openAddModal()"
            class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition-colors">
      <i class="fa fa-plus mr-1"></i>上架商品
    </button>
  </div>


  <!-- 加载提示 -->
  <div id="loading" class="text-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
    <p class="text-light mt-4">加载中...</p>
  </div>

  <!-- 商品列表容器 -->
  <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden"></div>

  <div id="pagination"></div>

  <!-- 空状态 -->
  <div id="emptyState" class="hidden text-center py-12">
    <i class="fa fa-shopping-bag text-5xl text-gray-300 mb-4"></i>
    <p class="text-light text-lg">还没有商品，快去上架吧</p>
  </div>

  <!-- 编辑商品弹窗 -->
  <div id="editModal" class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center z-50 flex">
    <div class="bg-white rounded-lg p-8 w-[480px] relative shadow-lg">
      <h2 class="text-xl font-bold text-dark mb-6">编辑商品</h2>
      <div class="space-y-4">
        <input type="hidden" id="editProductId">
        <div>
          <label class="block text-sm text-dark mb-1">商品名称</label>
          <input type="text" id="editProductName" class="w-full border border-border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">价格</label>
          <input type="number" id="editPrice" class="w-full border border-border rounded px-3 py-2" min="0" step="0.01">
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">库存</label>
          <input type="number" id="editStock" class="w-full border border-border rounded px-3 py-2" min="0">
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">描述</label>
          <textarea id="editDescription" rows="4" class="w-full border border-border rounded px-3 py-2"></textarea>
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">商品分类</label>
          <select id="editType" class="w-full border border-border rounded px-3 py-2">
            <option value="">请选择分类</option>
            <option value="数码电子">数码电子</option>
            <option value="服装鞋帽">服装鞋帽</option>
            <option value="生活用品">生活用品</option>
            <option value="学习办公">学习办公</option>
            <option value="食品饮料">食品饮料</option>
            <option value="美妆个护">美妆个护</option>
            <option value="运动户外">运动户外</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">商品图片 <span class="text-light text-xs">(可选，不选则保留原图)</span></label>
          <input type="file" id="editImage" accept="image/*" class="w-full border border-border rounded px-3 py-2">
          <img id="editImagePreview" class="mt-2 hidden w-full h-40 object-cover rounded">
        </div>
        <div class="flex justify-end space-x-2 pt-4">
          <button onclick="closeEditModal()" class="px-4 py-2 border border-border rounded hover:bg-gray-100">取消</button>
          <button onclick="saveEdit()" class="px-6 py-2 bg-primary text-white rounded hover:bg-orange-600">保存</button>
        </div>
      </div>
      <button onclick="closeEditModal()" class="absolute top-3 right-4 text-gray-500 hover:text-dark text-lg">
        <i class="fa fa-close"></i>
      </button>
    </div>
  </div>


  <!-- 新增商品弹窗 -->
  <div id="addModal" class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center z-50 flex">
    <div class="bg-white rounded-lg p-8 w-[480px] relative shadow-lg">
      <h2 class="text-xl font-bold text-dark mb-6">上架商品</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-dark mb-1">商品名称</label>
          <input type="text" id="addProductName" class="w-full border border-border rounded px-3 py-2">
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">价格</label>
          <input type="number" id="addPrice" class="w-full border border-border rounded px-3 py-2" min="0" step="0.01">
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">库存</label>
          <input type="number" id="addStock" class="w-full border border-border rounded px-3 py-2" min="0">
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">描述</label>
          <textarea id="addDescription" rows="4" class="w-full border border-border rounded px-3 py-2"></textarea>
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">商品分类</label>
          <select id="addType" class="w-full border border-border rounded px-3 py-2">
            <option value="">请选择分类</option>
            <option value="数码电子">数码电子</option>
            <option value="服装鞋帽">服装鞋帽</option>
            <option value="生活用品">生活用品</option>
            <option value="学习办公">学习办公</option>
            <option value="食品饮料">食品饮料</option>
            <option value="美妆个护">美妆个护</option>
            <option value="运动户外">运动户外</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">商品图片 <span class="text-red-500">*</span></label>
          <input type="file" id="addImage" accept="image/*" class="w-full border border-border rounded px-3 py-2">
          <img id="addImagePreview" class="mt-2 hidden w-full h-40 object-cover rounded">
        </div>
        <div class="flex justify-end space-x-2 pt-4">
          <button onclick="closeAddModal()" class="px-4 py-2 border border-border rounded hover:bg-gray-100">取消</button>
          <button onclick="submitAdd()" class="px-6 py-2 bg-green-500 text-white rounded hover:bg-green-600">确认上架</button>
        </div>
      </div>
      <button onclick="closeAddModal()" class="absolute top-3 right-4 text-gray-500 hover:text-dark text-lg">
        <i class="fa fa-close"></i>
      </button>
    </div>
  </div>



</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>

  let currentPage = 1;
  const pageSize = 6;

  axios.defaults.baseURL = window.location.origin + '/taobao';


  document.addEventListener('DOMContentLoaded', () => {
    loadProducts();
    document.getElementById('addImage').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const preview = document.getElementById('addImagePreview');
      if (file) {
        const reader = new FileReader();
        reader.onload = function(ev) { preview.src = ev.target.result; preview.classList.remove('hidden'); };
        reader.readAsDataURL(file);
      } else { preview.classList.add('hidden'); }
    });
    document.getElementById('editImage').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const preview = document.getElementById('editImagePreview');
      if (file) {
        const reader = new FileReader();
        reader.onload = function(ev) { preview.src = ev.target.result; preview.classList.remove('hidden'); };
        reader.readAsDataURL(file);
      } else { preview.classList.add('hidden'); }
    });
  });


  function loadProducts(page = 1) {
    currentPage = page;
    const loading = document.getElementById('loading');
    const productList = document.getElementById('productList');
    const emptyState = document.getElementById('emptyState');
    const pagination = document.getElementById('pagination');

    loading.classList.remove('hidden');
    productList.classList.add('hidden');
    emptyState.classList.add('hidden');
    if (pagination) pagination.innerHTML = '';

    axios.get('/merchant/my-products', { params: { page: page, size: pageSize } })
            .then(resp => {
              loading.classList.add('hidden');
              if (resp.data.code === 200 && resp.data.data) {
                const payload = resp.data.data;
                const products = payload.products || [];
                const total = payload.total || 0;
                const pages = payload.pages || 0;

                if (products.length > 0) {
                  productList.innerHTML = '';
                  products.forEach(product => {
                    productList.appendChild(createProductCard(product));
                  });
                  productList.classList.remove('hidden');
                  if (pages > 1) {
                    renderPagination(currentPage, pages, total);
                  }
                } else {
                  emptyState.classList.remove('hidden');
                }
              } else {
                emptyState.classList.remove('hidden');
              }
            })
            .catch(err => {
              loading.classList.add('hidden');
              emptyState.classList.remove('hidden');
              emptyState.innerHTML = `
                <i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>
                <p class="text-light">加载失败，请先登录</p>
            `;
            });
  }


  function searchMyProducts() {
    const keyword = document.getElementById('searchInput').value.trim();
    const loading = document.getElementById('loading');
    const productList = document.getElementById('productList');
    const emptyState = document.getElementById('emptyState');

    loading.classList.remove('hidden');
    productList.classList.add('hidden');
    emptyState.classList.add('hidden');

    axios.get('/merchant/my-products/search', { params: { keyword: keyword } })
            .then(resp => {
              loading.classList.add('hidden');
              if (resp.data.code === 200 && resp.data.data && resp.data.data.length > 0) {
                productList.innerHTML = '';
                resp.data.data.forEach(product => {
                  productList.appendChild(createProductCard(product));
                });
                productList.classList.remove('hidden');
              } else {
                emptyState.classList.remove('hidden');
                emptyState.innerHTML = `
                    <i class="fa fa-search text-5xl text-gray-300 mb-4"></i>
                    <p class="text-light text-lg">未找到相关商品</p>
                `;
              }
            })
            .catch(err => {
              loading.classList.add('hidden');
              emptyState.classList.remove('hidden');
              emptyState.innerHTML = `
                <i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>
                <p class="text-light">搜索失败，请重试</p>
            `;
            });
  }




  function createProductCard(product) {
    const card = document.createElement('div');
    card.className = 'bg-white rounded-lg shadow-sm overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1';
    card.innerHTML = `
    <img src="/taobao/product/${product.id}/image" class="w-full h-40 object-cover"
         onerror="this.src='https://picsum.photos/seed/${product.id}/300/200'">
    <div class="p-4">
        <h3 class="font-medium text-dark truncate">${product.product_name}</h3>
        ${product.type ? `<span class="inline-block mt-1 px-2 py-0.5 bg-orange-50 text-primary text-xs rounded">${product.type}</span>` : ''}
        <p class="text-primary font-bold mt-2">¥${product.price ? product.price.toFixed(2) : '0.00'}</p>
        <p class="text-light text-sm mt-1">库存：${product.stock}</p>
        <p class="text-light text-sm mt-1">${product.description ? product.description : '暂无描述'}</p>


        <div class="flex space-x-2 mt-2">
        <button onclick="openEditModal(${product.id}, '${product.product_name.replace(/'/g, "\\'")}', ${product.price}, ${product.stock}, '${(product.description || '').replace(/'/g, "\\'")}', '${(product.type || '').replace(/'/g, "\\'")}')"
            class="px-4 py-1 bg-blue-500 text-white text-sm rounded hover:bg-blue-600">
            编辑
        </button>

        <button onclick="delistProduct(${product.id}, '${product.product_name.replace(/'/g, "\\'")}', ${product.price}, '${(product.description || '').replace(/'/g, "\\'")}')"
            class="px-4 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600">
            下架
        </button>


</div>


    </div>
`;

    return card;
  }


  // 打开编辑弹窗，预填当前值
  function openEditModal(id, name, price, stock, description, type) {
    document.getElementById('editProductId').value = id;
    document.getElementById('editProductName').value = name;
    document.getElementById('editPrice').value = price;
    document.getElementById('editStock').value = stock;
    document.getElementById('editDescription').value = description;
    document.getElementById('editType').value = type || '';
    document.getElementById('editImage').value = '';
    document.getElementById('editImagePreview').classList.add('hidden');
    document.getElementById('editModal').classList.remove('hidden');
  }

  // 关闭编辑弹窗
  function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
  }

  // 保存编辑
  function saveEdit() {
    const productId = document.getElementById('editProductId').value;
    const productName = document.getElementById('editProductName').value.trim();
    const price = parseFloat(document.getElementById('editPrice').value);
    const stock = parseInt(document.getElementById('editStock').value);
    const description = document.getElementById('editDescription').value.trim();
    const imageFile = document.getElementById('editImage').files[0];

    if (!productName || isNaN(price) || isNaN(stock)) {
      alert('请完整填写商品信息');
      return;
    }

    const type = document.getElementById('editType').value;

    const formData = new FormData();
    formData.append('product', new Blob([JSON.stringify({
      id: parseInt(productId),
      product_name: productName,
      price: price,
      stock: stock,
      description: description,
      type: type || null
    })], {type: 'application/json'}));
    if (imageFile) {
      formData.append('image', imageFile);
    }

    axios.put('/product/update', formData, {
      headers: { 'Content-Type': 'multipart/form-data' }
    })
            .then(resp => {
              if (resp.data.code === 200) {
                alert('更新成功');
                closeEditModal();
                loadProducts();
              } else {
                alert(resp.data.msg || '更新失败');
              }
            })
            .catch(err => {
              console.error('更新失败:', err);
              alert('更新失败，请重试');
            });
  }



  // 切换商家账户下拉菜单
  function toggleMerchantMenu() {
    document.getElementById('merchantDropdown').classList.toggle('hidden');
  }

  // 点击页面其他地方关闭菜单
  document.addEventListener('click', function(e) {
    const menu = document.getElementById('merchantDropdown');
    const btn = e.target.closest('[onclick="toggleMerchantMenu()"]');
    if (menu && !menu.contains(e.target) && !btn) {
      menu.classList.add('hidden');
    }
  });



  // 打开新增弹窗
  function openAddModal() {
    document.getElementById('addProductName').value = '';
    document.getElementById('addPrice').value = '';
    document.getElementById('addStock').value = '';
    document.getElementById('addDescription').value = '';
    document.getElementById('addType').value = '';
    document.getElementById('addImage').value = '';
    document.getElementById('addImagePreview').classList.add('hidden');
    document.getElementById('addModal').classList.remove('hidden');
  }

  // 关闭新增弹窗
  function closeAddModal() {
    document.getElementById('addModal').classList.add('hidden');
  }

  // 提交新增
  function submitAdd() {
    const productName = document.getElementById('addProductName').value.trim();
    const price = parseFloat(document.getElementById('addPrice').value);
    const stock = parseInt(document.getElementById('addStock').value);
    const description = document.getElementById('addDescription').value.trim();
    const imageFile = document.getElementById('addImage').files[0];

    if (!productName || isNaN(price) || isNaN(stock)) {
      alert('请完整填写商品信息');
      return;
    }
    if (!imageFile) {
      alert('请选择商品图片');
      return;
    }
    const type = document.getElementById('addType').value;

    const formData = new FormData();
    formData.append('product', new Blob([JSON.stringify({
      product_name: productName,
      price: price,
      stock: stock,
      description: description,
      type: type || null
    })], {type: 'application/json'}));
    formData.append('image', imageFile);

    axios.post('/product/add', formData, {
      headers: { 'Content-Type': 'multipart/form-data' }
    })
            .then(resp => {
              if (resp.data.code === 200) {
                alert(resp.data.msg || '上架成功');
                closeAddModal();
                loadProducts();
              } else {
                alert(resp.data.msg || '上架失败');
              }
            })
            .catch(err => {
              console.error('上架失败:', err);
              alert('上架失败，请重试');
            });
  }

  //分页渲染函数(底端选择的)
  function renderPagination(current, totalPages, totalItems) {
    const container = document.getElementById('pagination');
    if (!container || totalPages <= 1) return;

    let html = '<div class="flex items-center justify-center space-x-2 mt-8">';
    html += `<button onclick="loadProducts(${current - 1})"
              class="px-3 py-2 border rounded-md text-sm ${current <= 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100'}"
              ${current <= 1 ? 'disabled' : ''}>上一页</button>`;
    html += `<span class="text-sm text-light">第 ${current} / ${totalPages} 页（共 ${totalItems} 件）</span>`;
    html += `<button onclick="loadProducts(${current + 1})"
              class="px-3 py-2 border rounded-md text-sm ${current >= totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100'}"
              ${current >= totalPages ? 'disabled' : ''}>下一页</button>`;
    html += '</div>';
    container.innerHTML = html;
  }



  function delistProduct(id, name, price, description) {
    if (!confirm(`确定下架商品"${name}"吗？此操作不可恢复！`)) return;

    axios.delete('/product/delete/' + id)
            .then(resp => {
              if (resp.data.code === 200) {
                alert('商品已下架');
                loadProducts();
              } else {
                alert(resp.data.msg || '下架失败');
              }
            })
            .catch(err => {
              console.error('下架失败:', err);
              alert('下架失败，请重试');
            });
  }

  function logout() {
    if (confirm('确定退出登录吗？')) {
      axios.post('/auth/logout')
              .then(() => {
                window.location.href = '/taobao/login.html';
              })
              .catch(err => {
                console.error('退出失败:', err);
                alert('退出登录失败，请重试');
              });
    }
  }
</script>
</body>
</html>
