<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商家中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff6a00',
            secondary: '#f5f5f5',
            dark: '#1a1a1a',
            light: '#888888',
            border: '#e8e8e8'
          }
        }
      }
    }
  </script>
  <style>
    .stat-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      display: flex; align-items: center; gap: 16px;
      transition: all 0.2s;
    }
    .stat-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.10); transform: translateY(-2px); }
    .stat-card .stat-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .stat-card .stat-value { font-size: 26px; font-weight: 700; color: #1a1a1a; }
    .stat-card .stat-label { font-size: 13px; color: #888; margin-top: 2px; }
    .product-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: all 0.2s;
    }
    .product-card:hover { box-shadow: 0 8px 28px rgba(0,0,0,0.12); transform: translateY(-3px); }
    .product-card img { width: 100%; height: 180px; object-fit: cover; }
    .product-card .card-body { padding: 16px; }
    .product-card .card-body h3 { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .product-card .card-footer { display: flex; gap: 6px; padding: 0 16px 16px; }
    .btn-sm { padding: 7px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-sm-primary { background: linear-gradient(135deg, #ff5e62, #ff6a00); color: #fff; }
    .btn-sm-primary:hover { opacity: 0.9; }
    .btn-sm-outline { background: #fff; color: #ff6a00; border: 1px solid #ffcdd2; }
    .btn-sm-outline:hover { background: #fff5f0; }
    .btn-sm-danger { background: #fff; color: #ff4d4f; border: 1px solid #ffccc7; }
    .btn-sm-danger:hover { background: #fff1f0; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: #fff; border-radius: 20px; padding: 28px; width: 500px; max-width: 92vw; max-height: 85vh; overflow-y: auto; position: relative; }
    .modal-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
    .modal-box label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 4px; }
    .modal-box input, .modal-box select, .modal-box textarea {
      width: 100%; border: 2px solid #f0f0f0; border-radius: 10px; padding: 10px 14px;
      font-size: 14px; outline: none; transition: border 0.2s; margin-bottom: 14px; background: #fafafa;
    }
    .modal-box input:focus, .modal-box select:focus, .modal-box textarea:focus { border-color: #ff6a00; background: #fff; }
  </style>
</head>
<body class="bg-orange-50/30 min-h-screen">

<header class="bg-white border-b border-border sticky top-0 z-40">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a href="/taobao/merchant-index.html" class="text-primary font-bold text-xl flex items-center gap-2">
      <i class="fa fa-shopping-bag"></i> 商家中心
    </a>
    <div class="hidden md:block flex-1 max-w-md mx-8">
      <div class="relative">
        <input id="searchInput" type="text" placeholder="搜索我的商品..."
               class="w-full pl-4 pr-10 py-2 border-2 border-gray-100 rounded-full focus:border-primary focus:outline-none text-sm"
               onkeydown="if(event.key==='Enter')searchMyProducts()">
        <button onclick="searchMyProducts()" class="absolute right-0 top-0 h-full px-4 text-primary"><i class="fa fa-search"></i></button>
      </div>
    </div>
    <div class="relative">
      <button onclick="toggleMenu()" class="flex items-center gap-2 text-dark hover:text-primary font-medium">
        <i class="fa fa-user-circle text-lg"></i> 商家账户 <i class="fa fa-caret-down text-xs"></i>
      </button>
      <div id="menuDropdown" class="absolute right-0 mt-2 w-44 bg-white rounded-xl shadow-lg py-2 hidden z-10 border border-gray-100">
        <a href="/taobao/merchant-profile.html" class="block px-4 py-2.5 text-sm text-dark hover:bg-orange-50">账户设置</a>
        <a href="/taobao/merchant-reviews.html" class="block px-4 py-2.5 text-sm text-dark hover:bg-orange-50">店铺评价</a>
        <a href="/taobao/merchant-orders.html" class="block px-4 py-2.5 text-sm text-dark hover:bg-orange-50">订单管理</a>
        <a href="/taobao/chat.html" class="block px-4 py-2.5 text-sm text-dark hover:bg-orange-50">消息咨询</a>
        <a href="/taobao/merchant-after-sale.html" class="block px-4 py-2.5 text-sm text-dark hover:bg-orange-50">售后管理</a>
        <div class="border-t my-1"></div>
        <a href="#" onclick="logout()" class="block px-4 py-2.5 text-sm text-red-500 hover:bg-red-50">退出登录</a>
      </div>
    </div>
  </div>
</header>

<main class="container mx-auto px-4 py-8">
  <!-- 数据看板 -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
    <div class="stat-card">
      <div class="stat-icon" style="background:#fff5f0;color:#ff6a00;"><i class="fa fa-cny"></i></div>
      <div><div class="stat-value" id="statRevenue">¥0</div><div class="stat-label">累计营收</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#f0f5ff;color:#1890ff;"><i class="fa fa-cube"></i></div>
      <div><div class="stat-value" id="statProducts">0</div><div class="stat-label">在售商品</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#f0fff4;color:#52c41a;"><i class="fa fa-file-text"></i></div>
      <div><div class="stat-value" id="statOrders">0</div><div class="stat-label">总订单数</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fff7e6;color:#fa8c16;"><i class="fa fa-wrench"></i></div>
      <div><div class="stat-value" id="statRefunds">0</div><div class="stat-label">待处理售后</div></div>
    </div>
  </div>

  <!-- 标题栏 -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-dark">我的商品</h2>
    <button onclick="openAddModal()" class="btn-sm btn-sm-primary" style="padding:10px 22px;font-size:14px;">
      <i class="fa fa-plus mr-1"></i> 上架商品
    </button>
  </div>

  <div id="loading" class="text-center py-16">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
    <p class="text-light mt-4">加载中...</p>
  </div>

  <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 hidden"></div>
  <div id="pagination" class="mt-8"></div>

  <div id="emptyState" class="hidden text-center py-16">
    <i class="fa fa-shopping-bag text-5xl text-gray-300 mb-4 block"></i>
    <p class="text-light text-lg">还没有商品，快去上架吧</p>
  </div>
</main>

<!-- 编辑弹窗 -->
<div id="editModal" class="fixed inset-0 bg-black bg-opacity-40 hidden z-50 flex items-center justify-center">
  <div class="modal-box">
    <button onclick="closeEditModal()" class="absolute top-4 right-4 text-gray-400 hover:text-dark text-lg"><i class="fa fa-close"></i></button>
    <h2>编辑商品</h2>
    <input type="hidden" id="editProductId">
    <label>商品名称</label>
    <input type="text" id="editProductName">
    <label>价格</label>
    <input type="number" id="editPrice" min="0" step="0.01">
    <label>库存</label>
    <input type="number" id="editStock" min="0">
    <label>描述</label>
    <textarea id="editDescription" rows="3"></textarea>
    <label>分类</label>
    <select id="editType">
      <option value="">请选择</option>
      <option>数码电子</option><option>服装鞋帽</option><option>生活用品</option>
      <option>学习办公</option><option>食品饮料</option><option>美妆个护</option><option>运动户外</option>
    </select>
    <label>商品图片 <span style="font-size:11px;color:#aaa;">(可选)</span></label>
    <input type="file" id="editImage" accept="image/*">
    <img id="editImagePreview" class="hidden w-full h-40 object-cover rounded-lg mt-2">
    <div class="flex justify-end gap-3 pt-4">
      <button onclick="closeEditModal()" class="btn-sm btn-sm-outline">取消</button>
      <button onclick="saveEdit()" class="btn-sm btn-sm-primary">保存</button>
    </div>
  </div>
</div>

<!-- 新增弹窗 -->
<div id="addModal" class="fixed inset-0 bg-black bg-opacity-40 hidden z-50 flex items-center justify-center">
  <div class="modal-box">
    <button onclick="closeAddModal()" class="absolute top-4 right-4 text-gray-400 hover:text-dark text-lg"><i class="fa fa-close"></i></button>
    <h2>上架商品</h2>
    <label>商品名称</label>
    <input type="text" id="addProductName">
    <label>价格</label>
    <input type="number" id="addPrice" min="0" step="0.01">
    <label>库存</label>
    <input type="number" id="addStock" min="1" value="1">
    <label>描述</label>
    <textarea id="addDescription" rows="3"></textarea>
    <label>分类</label>
    <select id="addType">
      <option value="">请选择</option>
      <option>数码电子</option><option>服装鞋帽</option><option>生活用品</option>
      <option>学习办公</option><option>食品饮料</option><option>美妆个护</option><option>运动户外</option>
    </select>
    <label>商品图片 <span style="font-size:11px;color:#f5222d;">*必选</span></label>
    <input type="file" id="addImage" accept="image/*">
    <img id="addImagePreview" class="hidden w-full h-40 object-cover rounded-lg mt-2">
    <div class="flex justify-end gap-3 pt-4">
      <button onclick="closeAddModal()" class="btn-sm btn-sm-outline">取消</button>
      <button onclick="submitAdd()" class="btn-sm btn-sm-primary">确认上架</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
  axios.defaults.baseURL = window.location.origin + '/taobao';
  var currentPage = 1, totalPages = 1, pageSize = 8;

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    loadDashboard();
    loadProducts(1);
  }

  function loadDashboard() {
    axios.get('/merchant/dashboard')
      .then(function(resp) {
        if (resp.data.code === 200) {
          var d = resp.data.data;
          document.getElementById('statRevenue').textContent = '¥' + (d.revenue || 0).toFixed(2);
          document.getElementById('statProducts').textContent = d.productCount || 0;
          document.getElementById('statOrders').textContent = d.orderCount || 0;
          document.getElementById('statRefunds').textContent = d.pendingRefundCount || 0;
        }
      });
  }

  function loadProducts(page) {
    currentPage = page;
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('productList').classList.add('hidden');
    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('pagination').innerHTML = '';

    axios.get('/merchant/my-products', { params: { page: page, size: pageSize } })
      .then(function(resp) {
        document.getElementById('loading').classList.add('hidden');
        var payload = resp.data.data;
        var products = payload ? payload.products : [];
        totalPages = payload ? payload.pages : 1;
        var list = document.getElementById('productList');
        list.innerHTML = '';
        if (products && products.length > 0) {
          products.forEach(function(p) { list.appendChild(createProductCard(p)); });
          list.classList.remove('hidden');
          renderPagination();
        } else {
          document.getElementById('emptyState').classList.remove('hidden');
        }
      })
      .catch(function() { document.getElementById('loading').classList.add('hidden'); });
  }

  function createProductCard(p) {
    var stockLabel = p.stock <= 0 ? '<span style="color:#ff4d4f;">售罄</span>' : '<span style="color:#52c41a;">库存 ' + p.stock + '</span>';
    var card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML =
      '<img src="/taobao/product/' + p.id + '/image" onerror="this.src=\'https://picsum.photos/seed/' + p.id + '/300/200\'" alt="' + p.product_name + '">' +
      '<div class="card-body">' +
        '<h3>' + p.product_name + '</h3>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<span style="font-size:18px;font-weight:700;color:#ff5e62;">¥' + (p.price || 0).toFixed(2) + '</span>' +
          '<span style="font-size:12px;">' + stockLabel + '</span>' +
        '</div>' +
        (p.type ? '<span style="display:inline-block;margin-top:6px;padding:2px 10px;background:#fff5f0;color:#ff6a00;border-radius:10px;font-size:11px;">' + p.type + '</span>' : '') +
      '</div>' +
      '<div class="card-footer">' +
        '<button class="btn-sm btn-sm-outline" onclick="openEditModal(' + p.id + ', \'' + p.product_name.replace(/'/g,"\\'") + '\', ' + p.price + ', ' + p.stock + ', \'' + (p.description || '').replace(/'/g,"\\'") + '\', \'' + (p.type || '').replace(/'/g,"\\'") + '\')">编辑</button>' +
        '<button class="btn-sm btn-sm-danger" onclick="deleteProduct(' + p.id + ', \'' + p.product_name.replace(/'/g,"\\'") + '\')">下架</button>' +
      '</div>';
    return card;
  }

  function renderPagination() {
    var c = document.getElementById('pagination');
    if (totalPages <= 1) { c.innerHTML = ''; return; }
    c.innerHTML =
      '<div class="flex items-center justify-center space-x-2">' +
        '<button onclick="loadProducts(' + (currentPage - 1) + ')" class="px-3 py-2 border rounded-md text-sm ' + (currentPage <= 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100') + '" ' + (currentPage <= 1 ? 'disabled' : '') + '>上一页</button>' +
        '<span class="text-sm text-light">第 ' + currentPage + ' / ' + totalPages + ' 页</span>' +
        '<button onclick="loadProducts(' + (currentPage + 1) + ')" class="px-3 py-2 border rounded-md text-sm ' + (currentPage >= totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100') + '" ' + (currentPage >= totalPages ? 'disabled' : '') + '>下一页</button>' +
      '</div>';
  }

  var editId = null;
  function openEditModal(id, name, price, stock, desc, type) {
    editId = id;
    document.getElementById('editProductId').value = id;
    document.getElementById('editProductName').value = name;
    document.getElementById('editPrice').value = price;
    document.getElementById('editStock').value = stock;
    document.getElementById('editDescription').value = desc;
    document.getElementById('editType').value = type || '';
    document.getElementById('editImage').value = '';
    document.getElementById('editImagePreview').classList.add('hidden');
    document.getElementById('editModal').classList.remove('hidden');
  }

  function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); editId = null; }

  function saveEdit() {
    var form = new FormData();
    var product = {
      id: parseInt(document.getElementById('editProductId').value),
      product_name: document.getElementById('editProductName').value.trim(),
      price: parseFloat(document.getElementById('editPrice').value),
      stock: parseInt(document.getElementById('editStock').value),
      description: document.getElementById('editDescription').value.trim(),
      type: document.getElementById('editType').value
    };
    form.append('product', new Blob([JSON.stringify(product)], { type: 'application/json' }));
    var img = document.getElementById('editImage').files[0];
    if (img) form.append('image', img);
    else form.append('image', new Blob([]));
    axios.put('/product/update', form)
      .then(function(resp) {
        if (resp.data.code === 200) { alert('更新成功'); closeEditModal(); loadProducts(currentPage); loadDashboard(); }
        else alert(resp.data.msg || '更新失败');
      })
      .catch(function() { alert('保存失败'); });
  }

  function openAddModal() {
    document.getElementById('addProductName').value = '';
    document.getElementById('addPrice').value = '';
    document.getElementById('addStock').value = '1';
    document.getElementById('addDescription').value = '';
    document.getElementById('addType').value = '';
    document.getElementById('addImage').value = '';
    document.getElementById('addImagePreview').classList.add('hidden');
    document.getElementById('addModal').classList.remove('hidden');
  }

  function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

  function submitAdd() {
    var form = new FormData();
    var product = {
      product_name: document.getElementById('addProductName').value.trim(),
      price: parseFloat(document.getElementById('addPrice').value),
      stock: parseInt(document.getElementById('addStock').value),
      description: document.getElementById('addDescription').value.trim(),
      type: document.getElementById('addType').value
    };
    if (!product.product_name || !product.price || !product.type) { alert('请填写名称、价格和分类'); return; }
    form.append('product', new Blob([JSON.stringify(product)], { type: 'application/json' }));
    var img = document.getElementById('addImage').files[0];
    if (!img) { alert('请选择商品图片'); return; }
    form.append('image', img);
    axios.post('/product/add', form)
      .then(function(resp) {
        if (resp.data.code === 200) { alert('上架成功'); closeAddModal(); loadProducts(1); loadDashboard(); }
        else alert(resp.data.msg || '上架失败');
      })
      .catch(function() { alert('上架失败'); });
  }

  function deleteProduct(id, name) {
    if (!confirm('确定下架「' + name + '」吗？此操作不可恢复。')) return;
    axios.delete('/product/delete/' + id)
      .then(function(resp) {
        if (resp.data.code === 200) { alert('已下架'); loadProducts(currentPage); loadDashboard(); }
        else alert(resp.data.msg || '下架失败');
      })
      .catch(function() { alert('操作失败'); });
  }

  function searchMyProducts() {
    var kw = document.getElementById('searchInput').value.trim();
    if (!kw) { loadProducts(1); return; }
    axios.get('/merchant/my-products/search', { params: { keyword: kw } })
      .then(function(resp) {
        var list = document.getElementById('productList');
        list.innerHTML = '';
        if (resp.data.code === 200 && resp.data.data && resp.data.data.length > 0) {
          resp.data.data.forEach(function(p) { list.appendChild(createProductCard(p)); });
          list.classList.remove('hidden');
        } else {
          document.getElementById('emptyState').classList.remove('hidden');
        }
        document.getElementById('pagination').innerHTML = '';
        document.getElementById('loading').classList.add('hidden');
      });
  }

  function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('hidden'); }
  document.addEventListener('click', function(e) {
    var m = document.getElementById('menuDropdown');
    var b = e.target.closest('button');
    if (m && !m.contains(e.target) && !b) m.classList.add('hidden');
  });

  document.getElementById('editImage').addEventListener('change', function(e) {
    var f = e.target.files[0];
    if (f) {
      var reader = new FileReader();
      reader.onload = function(ev) { var img = document.getElementById('editImagePreview'); img.src = ev.target.result; img.classList.remove('hidden'); };
      reader.readAsDataURL(f);
    }
  });
  document.getElementById('addImage').addEventListener('change', function(e) {
    var f = e.target.files[0];
    if (f) {
      var reader = new FileReader();
      reader.onload = function(ev) { var img = document.getElementById('addImagePreview'); img.src = ev.target.result; img.classList.remove('hidden'); };
      reader.readAsDataURL(f);
    }
  });

  function logout() {
    if (confirm('确定要退出吗？')) {
      axios.post('/auth/logout').then(function() { window.location.href = '/taobao/login.html'; });
    }
  }
</script>
</body>
</html>
