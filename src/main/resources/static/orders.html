<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的订单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff6a00',
            secondary: '#f5f5f5',
            dark: '#1a1a1a',
            light: '#888888',
            border: '#e8e8e8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-border">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a href="/taobao/index.html" class="text-primary text-xl font-bold">
      <i class="fa fa-shopping-bag mr-2"></i>返回首页
    </a>
    <h1 class="text-dark text-2xl font-bold">我的订单</h1>
    <div></div>
  </div>
</header>

<main class="container mx-auto px-4 py-8">
  <!-- 状态筛选标签 -->
  <div class="flex space-x-2 mb-6">
    <button onclick="filterOrders(0)" id="btnAll" class="px-4 py-2 rounded-md bg-primary text-white">全部</button>
    <button onclick="filterOrders(1)" id="btnPending" class="px-4 py-2 rounded-md border border-border text-dark hover:bg-gray-100">未支付</button>
    <button onclick="filterOrders(2)" id="btnPaid" class="px-4 py-2 rounded-md border border-border text-dark hover:bg-gray-100">已支付</button>
    <button onclick="filterOrders(3)" id="btnReceived" class="px-4 py-2 rounded-md border border-border text-dark hover:bg-gray-100">已签收</button>
  </div>

  <!-- 加载提示 -->
  <div id="loading" class="text-center py-12 hidden">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
    <p class="text-light mt-4">加载中...</p>
  </div>

  <!-- 订单列表容器 -->
  <div id="orderList" class="space-y-4"></div>

  <!-- 空状态 -->
  <div id="emptyState" class="hidden text-center py-12">
    <i class="fa fa-inbox text-5xl text-gray-300 mb-4"></i>
    <p class="text-light text-lg">暂无相关订单</p>
    <a href="/taobao/index.html" class="text-primary hover:underline mt-2 inline-block">去购物</a>
  </div>

  <!-- 评价弹窗 -->
  <div id="reviewModal" class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center z-50 flex">
    <div class="bg-white rounded-lg p-8 w-[480px] relative shadow-lg">
      <h2 class="text-xl font-bold text-dark mb-6">评价商品</h2>
      <div class="space-y-4">

        <div>
          <label class="block text-sm text-dark mb-1">商品名称</label>
          <input type="text" id="reviewProductName" class="w-full border border-border rounded px-3 py-2 bg-gray-100" disabled>
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">评分</label>
          <div class="flex space-x-1" id="starRating">
            <i class="fa fa-star text-2xl text-gray-300 cursor-pointer" data-score="1"></i>
            <i class="fa fa-star text-2xl text-gray-300 cursor-pointer" data-score="2"></i>
            <i class="fa fa-star text-2xl text-gray-300 cursor-pointer" data-score="3"></i>
            <i class="fa fa-star text-2xl text-gray-300 cursor-pointer" data-score="4"></i>
            <i class="fa fa-star text-2xl text-gray-300 cursor-pointer" data-score="5"></i>
          </div>
          <input type="hidden" id="reviewScore" value="0">
        </div>
        <div>
          <label class="block text-sm text-dark mb-1">评价内容</label>
          <textarea id="reviewContent" rows="4" class="w-full border border-border rounded px-3 py-2" placeholder="请输入您的评价..."></textarea>
        </div>
        <div class="flex justify-end space-x-2 pt-4">
          <button onclick="closeReviewModal()" class="px-4 py-2 border border-border rounded hover:bg-gray-100">取消</button>
          <button onclick="submitReview()" class="px-6 py-2 bg-primary text-white rounded hover:bg-orange-600">提交评价</button>
        </div>
      </div>
      <button onclick="closeReviewModal()" class="absolute top-3 right-4 text-gray-500 hover:text-dark text-lg">
        <i class="fa fa-close"></i>
      </button>

    </div>
  </div>


</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>


<script>
  axios.defaults.baseURL = window.location.origin + '/taobao';
  let allOrders = [];
  let currentFilter = 0;  // 0全部,1待支付,2已支付,3已签收
  let currentReviewOrderId = null;
  let reviewableOrderIds = [];
  let reviewedOrderIds = [];


  document.addEventListener('DOMContentLoaded', () => {
    loadOrders();
  });


    function loadOrders() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('orderList').innerHTML = '';
      document.getElementById('emptyState').classList.add('hidden');

      // axios并行请求：订单列表 + 可评价订单列表
      Promise.all([
        axios.get('/order/consumerSelf'),
        axios.get('/review/reviewable'),
        axios.get('/review/my')
      ])
              .then(([orderResp, reviewableResp, myReviewResp]) => {
                document.getElementById('loading').classList.add('hidden');



                if (orderResp.data.code === 200) {
                  allOrders = orderResp.data.data || [];
                }
                else {
                  allOrders = [];
                }

                if (reviewableResp.data.code === 200) {
                  const reviewableOrders = reviewableResp.data.data || [];
                  reviewableOrderIds = reviewableOrders.map(order => order.id);
                }
                else {
                  reviewableOrderIds = [];
                }

                if (myReviewResp.data.code === 200) {
                  const myReviews = myReviewResp.data.data || [];
                  reviewedOrderIds = myReviews.map(r => r.order_id);
                }
                else {
                  reviewedOrderIds = [];
                }


                applyFilter();
              })
              .catch(err => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyState').innerHTML =
                        '<i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>' +
                        '<p class="text-light">加载失败，请先登录</p>';
              });
    }

  function filterOrders(status) {
    // 更新按钮样式
    ['btnAll','btnPending','btnPaid','btnReceived'].forEach(id => {
      const btn = document.getElementById(id);
      btn.className = btn.className.replace('bg-primary text-white', 'border border-border text-dark hover:bg-gray-100');
    });
    const activeBtn = document.getElementById(
            status === 0 ? 'btnAll' : (status === 1 ? 'btnPending' : (status === 2 ? 'btnPaid' : 'btnReceived'))
    );
    activeBtn.className = activeBtn.className.replace('border border-border text-dark hover:bg-gray-100', 'bg-primary text-white');

    currentFilter = status;
    applyFilter();
  }

  function applyFilter() {
    const filtered = currentFilter === 0
            ? allOrders
            : allOrders.filter(o => o.status === currentFilter);

    const listEl = document.getElementById('orderList');
    const emptyEl = document.getElementById('emptyState');

    if (filtered.length === 0) {
      listEl.innerHTML = '';
      emptyEl.classList.remove('hidden');
      return;
    }

    emptyEl.classList.add('hidden');
    listEl.innerHTML = '';
    filtered.forEach(order => {
      listEl.appendChild(createOrderCard(order));
    });
  }

  function createOrderCard(order) {
    const statusMap = {
      1: { text: '未支付', color: 'text-yellow-600 bg-yellow-50' },
      2: { text: '已支付', color: 'text-blue-600 bg-blue-50' },
      3: { text: '已签收', color: 'text-green-600 bg-green-50' }
    };
    const st = statusMap[order.status] || { text: '未知', color: 'text-gray-600 bg-gray-50' };

    const card = document.createElement('div');
    card.className = 'bg-white rounded-lg shadow-sm p-4';

    card.innerHTML = `
            <div class="flex justify-between items-start">
                <div class="flex-1">
                    <h3 class="font-medium text-dark">${order.product_name}</h3>
                    <p class="text-light text-sm mt-1">
                        <i class="fa fa-store mr-1"></i>${order.merchant_name}
                    </p>
                    <p class="text-primary font-bold mt-2">¥${order.total_amount ? order.total_amount.toFixed(2) : '0.00'}</p>
                    <div class="text-light text-xs mt-2 space-x-4">
                        <span>创建：${formatTime(order.create_time)}</span>
                        <span>更新：${formatTime(order.update_time)}</span>
                    </div>
                </div>
                <div class="text-right">
                    <span class="inline-block px-2 py-1 rounded text-xs font-medium ${st.color}">${st.text}</span>

                    <!--  设计一个定时任务，签收后 60 s的订单 显示商家已经发货的文本  -->
                    ${order.status === 2 ? `
                            ${(() => {
                            const now = new Date().getTime();
                            const createTime = new Date(order.create_time).getTime();
                            if ((now - createTime) > 60000) {
                             return '<p class="text-green-600 text-sm mt-1">商家已发货，等待收货</p>';
                            }
                          return '';
                    })()}


    <button onclick="confirmReceive(${order.id})"
        class="block mt-2 px-3 py-1 bg-green-500 text-white text-sm rounded hover:bg-green-600">
        确认签收
    </button>
` : ''}


                    ${order.status === 3 ? (reviewedOrderIds.includes(order.id) ? `
                        <span class="block mt-2 px-3 py-1 bg-gray-200 text-gray-600 text-sm rounded">已评价</span>
                            ` : (reviewableOrderIds.includes(order.id) ? `
                        <button onclick="openReviewModal(${order.id}, '${order.product_name.replace(/'/g, "\\'")}')"
                            class="block mt-2 px-3 py-1 bg-orange-500 text-white text-sm rounded hover:bg-orange-600">
                            评价
                        </button>
                    ` : '')
            ) : ''}


                </div>
            </div>
        `;
    return card;
  }

  function confirmReceive(orderId) {
    if (!confirm('确认已收到商品吗？')) return;
    axios.put(`/order/${orderId}/confirm`)
            .then(resp => {
              if (resp.data.code === 200) {
                alert('签收成功');
                loadOrders();
              } else {
                alert(resp.data.msg || '签收失败');
              }
            })
            .catch(err => {
              console.error('签收失败:', err);
              alert('签收失败，请重试');
            });
  }


  // 打开评价弹窗
  function openReviewModal(orderId, productName) {
    currentReviewOrderId = orderId;
    document.getElementById('reviewProductName').value = productName;
    document.getElementById('reviewScore').value = 0;
    document.getElementById('reviewContent').value = '';
    // 重置星星
    document.querySelectorAll('#starRating i').forEach(star => {
      star.classList.remove('text-orange-400');
      star.classList.add('text-gray-300');
    });
    document.getElementById('reviewModal').classList.remove('hidden');
  }

  // 关闭评价弹窗
  function closeReviewModal() {
    document.getElementById('reviewModal').classList.add('hidden');
    currentReviewOrderId = null;
  }

  // 星星点击事件
  document.addEventListener('click', function(e) {
    if (e.target.closest('#starRating i')) {
      const star = e.target.closest('i');
      const score = parseInt(star.getAttribute('data-score'));
      document.getElementById('reviewScore').value = score;
      const stars = document.querySelectorAll('#starRating i');
      stars.forEach((s, index) => {
        if (index < score) {
          s.classList.remove('text-gray-300');
          s.classList.add('text-orange-400');
        } else {
          s.classList.remove('text-orange-400');
          s.classList.add('text-gray-300');
        }
      });
    }
  });

  // 提交评价
  function submitReview() {
    const score = parseInt(document.getElementById('reviewScore').value);
    const content = document.getElementById('reviewContent').value.trim();

    if (score === 0) {
      alert('请选择评分');
      return;
    }
    if (!content) {
      alert('请输入评价内容');
      return;
    }

    axios.post('/review/submit', {
      orderId: currentReviewOrderId,
      score: score,
      content: content
    })
            .then(resp => {
              if (resp.data.code === 200) {
                alert('评价成功！');
                closeReviewModal();
                loadOrders();
              } else {
                alert(resp.data.msg || '评价失败');
              }
            })
            .catch(err => {
              console.error('评价失败:', err);
              alert('评价失败，请重试');
            });
  }

  function formatTime(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }



</script>
</body>
</html>
