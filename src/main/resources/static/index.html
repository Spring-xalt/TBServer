<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仿淘宝商城 - 首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/taobao/style.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff4400',
            secondary: '#f5f5f5',
            dark: '#333333',
            light: '#666666',
            border: '#dddddd'
          },
          fontFamily: {
            sans: ['Microsoft YaHei', 'Arial', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .product-card {
        @apply bg-white rounded-lg shadow-sm overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1;
      }
      .btn-primary {
        @apply bg-primary hover:bg-orange-600 text-white font-medium py-2 px-4 rounded-md transition-colors duration-300;
      }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
<!-- 顶部导航 -->
<header class="bg-white border-b border-border sticky top-0 z-50">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center py-4">
      <!-- 网站Logo -->
      <div class="flex items-center">
        <a href="/taobao/index.html" class="text-primary text-2xl font-bold flex items-center">
          <i class="fa fa-shopping-bag mr-2"></i>
          <span>仿淘宝商城</span>
        </a>
      </div>


      <div class="hidden md:block flex-1 max-w-xl mx-8">
        <div class="relative">
          <input id="searchInput" type="text" placeholder="搜索商品..."
                 class="w-full pl-4 pr-10 py-2 border border-border rounded-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
          <button onclick="searchProducts()" class="absolute right-0 top-0 h-full px-4 text-primary hover:text-orange-600">
            <i class="fa fa-search"></i>
          </button>
        </div>
      </div>



      <!-- 用户操作区（根据登录状态动态显示） -->
      <div class="flex items-center space-x-4" id="userActions">
        <!-- 未登录状态显示 -->
        <div id="guestActions" class="flex items-center space-x-4">
          <a href="/taobao/login.html" class="text-dark hover:text-primary transition-colors">
            <i class="fa fa-user-circle mr-1"></i>登录
          </a>
          <a href="/taobao/register.html" class="text-dark hover:text-primary transition-colors">
            <i class="fa fa-user-plus mr-1"></i>注册
          </a>
        </div>

        <!-- 消费者登录状态显示（默认隐藏） -->
        <div id="consumerActions" class="hidden flex items-center space-x-4">
          <div class="relative">


            <a href="/taobao/cart.html" class="text-dark hover:text-primary transition-colors">
              <i class="fa fa-shopping-cart mr-1"></i>购物车
            </a>
            <span id="cartCount" class="absolute -top-2 -right-2 bg-primary text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>

          </div>

          <div class="relative group">

            <span onclick="toggleAccountMenu()"
                  class="text-dark hover:text-primary transition-colors cursor-pointer">
                <i class="fa fa-user-circle mr-1"></i>我的账户
            </span>



            <div id="accountDropdown"
                 class="absolute right-0 mt-2 w-48 bg-white shadow-md rounded-md py-2 hidden z-10">

              <a href="/taobao/profile.html" class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">个人中心</a>


              <a href="#" class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">我的订单</a>

              <div class="border-t border-gray-100 my-1"></div>
              <a href="#" onclick="logout()" class="block px-4 py-2 text-sm text-red-500 hover:bg-gray-100">退出登录</a>
            </div>
          </div>
        </div>

        <!-- 商户登录状态显示（默认隐藏） -->
        <div id="merchantActions" class="hidden flex items-center space-x-4">
          <a href="/taobao/merchant-center.html" class="text-dark hover:text-primary transition-colors">
            <i class="fa fa-store mr-1"></i>商户中心
          </a>
          <div class="relative group">
                            <span class="text-dark hover:text-primary transition-colors cursor-pointer">
                                <i class="fa fa-user-circle mr-1"></i>商户账户
                            </span>
            <div class="absolute right-0 mt-2 w-48 bg-white shadow-md rounded-md py-2 hidden group-hover:block z-10">
              <a href="#" class="block px-4 py-2 text-sm text-dark hover:bg-gray-100">账户设置</a>
              <div class="border-t border-gray-100 my-1"></div>
              <a href="#" onclick="logout()" class="block px-4 py-2 text-sm text-red-500 hover:bg-gray-100">退出登录</a>
            </div>
          </div>
        </div>

        <!-- 管理员登录状态显示（默认隐藏） -->
        <div id="adminActions" class="hidden flex items-center space-x-4">
          <a href="/taobao/admin-dashboard.html" class="text-dark hover:text-primary transition-colors">
            <i class="fa fa-cog mr-1"></i>管理中心
          </a>
          <div class="relative group">
                            <span class="text-dark hover:text-primary transition-colors cursor-pointer">
                                <i class="fa fa-user-circle mr-1"></i>管理员账户
                            </span>
            <div class="absolute right-0 mt-2 w-48 bg-white shadow-md rounded-md py-2 hidden group-hover:block z-10">
              <div class="border-t border-gray-100 my-1"></div>
              <a href="#" onclick="logout()" class="block px-4 py-2 text-sm text-red-500 hover:bg-gray-100">退出登录</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- 主内容区 -->
<main class="container mx-auto px-4 py-8">
  <!-- 页面标题 -->
  <div class="mb-8">
    <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-dark">商品列表</h1>
    <p class="text-light mt-2">浏览我们的精选商品</p>
  </div>

  <!-- 产品列表 -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="productList">
    <!-- 产品卡片将通过JavaScript动态生成 -->
  </div>
  <div id="pagination"></div>


  <!-- 加载提示 -->
  <div id="loadingIndicator" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
    <p class="ml-4 text-light">加载商品中...</p>
  </div>



  <!-- 无商品提示（默认隐藏） -->
  <div id="noProducts" class="hidden text-center py-12">
    <i class="fa fa-shopping-basket text-4xl text-gray-300 mb-4"></i>
    <p class="text-light">暂无商品可供展示</p>
  </div>
</main>

<!-- 页脚 -->
<footer class="bg-white border-t border-border mt-12">
  <div class="container mx-auto px-4 py-8">
    <div class="text-center text-light text-sm">
      <p>© 2023 仿淘宝商城 版权所有</p>
      <p class="mt-2">联系方式：service@example.com</p>
    </div>
  </div>
</footer>


<!-- 引入AXIOS -->
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
  // 基础配置
  // 动态 baseURL（如果后端是在 /taobao 上下文）
  axios.defaults.baseURL = window.location.origin + '/taobao';
  axios.defaults.headers.post['Content-Type'] = 'application/json;charset=utf-8';


  //让如果要修改单页商品数 此处pageSize和后端的dedfault都要修改
  let currentPage = 1;
  const pageSize = 8;

  document.addEventListener('DOMContentLoaded', function() {
    checkLoginStatus();
    loadProducts();
  });

  // 检查登录状态（依赖后端提供 /auth/status）
  function checkLoginStatus() {
    axios.get('/auth/status')
            .then(resp => {
              // 后端使用通用 R 类时： { code,msg,data }
              const body = resp.data;
              const payload = body && (body.data !== undefined ? body.data : body);
              // payload 期望类似 { loggedIn: true/false, role: 'consumer'|'merchant'|'admin'|'guest' }
              const loggedIn = payload && payload.loggedIn;
              const role = payload && payload.role;

              if (loggedIn) {
                document.getElementById('guestActions').classList.add('hidden');

                if (role === 'consumer') {
                  document.getElementById('consumerActions').classList.remove('hidden');
                  // 加载购物车角标
                  axios.get('/cart/count')
                          .then(resp => {
                            if (resp.data.code === 200) {
                              document.getElementById('cartCount').innerText = resp.data.data;
                            }
                          });
                }

                else if (role === 'merchant') document.getElementById('merchantActions').classList.remove('hidden');
                else if (role === 'admin') document.getElementById('adminActions').classList.remove('hidden');
              } else {
                document.getElementById('guestActions').classList.remove('hidden');
              }
            })
            .catch(err => {
              console.warn('检查登录状态失败，默认未登录', err);
              document.getElementById('guestActions').classList.remove('hidden');
            });
  }
  //
  function loadProducts(page = 1) {
    currentPage = page;
    const productListElement = document.getElementById('productList');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const noProductsElement = document.getElementById('noProducts');
    const paginationElement = document.getElementById('pagination');

    // 清空当前列表和分页
    productListElement.innerHTML = '';
    noProductsElement.classList.add('hidden');
    loadingIndicator.classList.remove('hidden');
    if (paginationElement) paginationElement.innerHTML = '';

    // 请求分页接口
    axios.get('/product/all', { params: { page, size: pageSize } })
            .then(resp => {
              loadingIndicator.classList.add('hidden');
              const body = resp.data;
              const payload = body && body.data;           // 取 data 字段
              const products = payload && payload.products ? payload.products : [];
              const total = payload ? payload.total : 0;
              const pages = payload ? payload.pages : 0;

              if (products.length > 0) {
                products.forEach(product => {
                  const card = createProductCard(product);
                  productListElement.appendChild(card);
                });
                // 绘制分页按钮
                renderPagination(currentPage, pages, total);
              } else {
                noProductsElement.classList.remove('hidden');
              }
            })
            .catch(err => {
              console.error('加载产品失败:', err);
              loadingIndicator.classList.add('hidden');
              noProductsElement.classList.remove('hidden');
              noProductsElement.innerHTML = `
        <i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>
        <p class="text-light">加载商品失败，请稍后重试</p>
      `;
            });
  }

  function renderPagination(current, totalPages, totalItems) {
    const container = document.getElementById('pagination');
    if (!container || totalPages <= 1) return;  // 只有一页时不显示分页

    let html = '<div class="flex items-center justify-center space-x-2 mt-8">';

    // 上一页按钮
    html += `<button onclick="loadProducts(${current - 1})"
            class="px-3 py-2 border rounded-md text-sm ${current <= 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100'}"
            ${current <= 1 ? 'disabled' : ''}>上一页</button>`;

    // 页码信息
    html += `<span class="text-sm text-light">第 ${current} / ${totalPages} 页（共 ${totalItems} 件）</span>`;

    // 下一页按钮
    html += `<button onclick="loadProducts(${current + 1})"
            class="px-3 py-2 border rounded-md text-sm ${current >= totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100'}"
            ${current >= totalPages ? 'disabled' : ''}>下一页</button>`;

    html += '</div>';
    container.innerHTML = html;
  }

  //   const productListElement = document.getElementById('productList');
  //   const loadingIndicator = document.getElementById('loadingIndicator');

  //         <i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>
  //         <p class="text-light">加载商品失败，请稍后重试</p>
  //       `;

  function searchProducts() {
    const keyword = document.getElementById('searchInput').value.trim();

    const productListElement = document.getElementById('productList');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const noProductsElement = document.getElementById('noProducts');

    if (!keyword) {
      alert('请输入搜索关键词！');
      return;
    }

    productListElement.innerHTML = '';
    noProductsElement.classList.add('hidden');
    loadingIndicator.classList.remove('hidden');

    axios.get('/product/search', { params: { keyword } })
            .then(resp => {
              loadingIndicator.classList.add('hidden');
              const body = resp.data;
              const products = Array.isArray(body) ? body : (body && (body.data || []));
              if (products && products.length > 0) {
                products.forEach(product => {
                  productListElement.appendChild(createProductCard(product));
                });
              } else {
                noProductsElement.classList.remove('hidden');
                noProductsElement.innerHTML = `
          <i class="fa fa-search text-4xl text-gray-300 mb-4"></i>
          <p class="text-light">没有找到相关商品</p>
        `;
              }
            })
            .catch(err => {
              console.error('搜索失败:', err);
              loadingIndicator.classList.add('hidden');
              noProductsElement.classList.remove('hidden');
              noProductsElement.innerHTML = `
        <i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>
        <p class="text-light">搜索失败，请稍后重试</p>
      `;
            });
  }



  // 创建产品卡片
  function createProductCard(product) {
    const card = document.createElement('div');
    card.className = 'product-card';

    // 格式化价格显示
    const price = product.price ? product.price.toFixed(2) : '0.00';

    card.innerHTML = `
                <div class="relative">
                    <img src="https://picsum.photos/seed/${product.id}/300/200" alt="${product.product_name}"
                         class="w-full h-48 object-cover">
                    ${product.stock <= 0 ? `
                        <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                            <span class="text-white font-bold text-lg">已售罄</span>
                        </div>
                    ` : ''}
                </div>
                <div class="p-4">
                    <h3 class="font-medium text-dark line-clamp-1">${product.product_name}</h3>
                    <p class="text-primary font-bold mt-2">¥${price}</p>
                    <p class="text-light text-sm mt-1 line-clamp-2 h-10">${product.description || '暂无描述'}</p>
                    <div class="mt-4">
                        <button class="btn-primary w-full ${product.stock <= 0 ? 'opacity-50 cursor-not-allowed' : ''}"
                                ${product.stock <= 0 ? 'disabled' : `onclick="addToCart(${product.id})"`}>
                            <i class="fa fa-shopping-cart mr-1"></i>
                            ${product.stock <= 0 ? '已售罄' : '加入购物车'}
                        </button>
                    </div>
                </div>
            `;

    return card;
  }

  function addToCart(productId) {
    // 检查是否登录
    axios.get('/auth/status')
            .then(response => {
              const body = response.data;
              const payload = body && (body.data !== undefined ? body.data : body);
              const loggedIn = payload && payload.loggedIn;

              if (!loggedIn) {
                window.location.href = '/taobao/login.html?redirect=/taobao/index.html';
                return;
              }

              // 已登录，调后端加入购物车（URL 参数）
              axios.post('/cart/add?productId=' + productId)
                      .then(resp => {
                        if (resp.data.code === 200) {
                          alert(resp.data.msg || '已加入购物车');
                          // 重新从后端获取准确的种类数，更新角标
                          axios.get('/cart/count')
                                  .then(countResp => {
                                    if (countResp.data.code === 200) {
                                      const countEl = document.getElementById('cartCount');
                                      if (countEl) {
                                        countEl.innerText = countResp.data.data;
                                      }
                                    }
                                  });
                        } else {
                          alert(resp.data.msg || '加入购物车失败');
                        }
                      })
                      .catch(error => {
                        console.error('加入购物车失败:', error);
                        alert('加入购物车失败，请重试');
                      });
            })
            .catch(error => {
              console.error('检查登录状态失败:', error);
              alert('操作失败，请重试');
            });
  }

  // 退出登录
  function logout() {
    if (confirm('确定要退出登录吗？')) {
      axios.post('/auth/logout')
              .then(response => {
                window.location.reload();
              })
              .catch(error => {
                console.error('退出登录失败:', error);
                alert('退出登录失败，请重试');
              });
    }
  }


  // 切换账户下拉菜单
  function toggleAccountMenu() {
    document.getElementById('accountDropdown').classList.toggle('hidden');
  }

  // 点击页面其他地方关闭菜单
  document.addEventListener('click', function(e) {
    const menu = document.getElementById('accountDropdown');
    const btn = e.target.closest('[onclick="toggleAccountMenu()"]');
    if (menu && !menu.contains(e.target) && !btn) {
      menu.classList.add('hidden');
    }
  });

</script>
</body>
</html>
