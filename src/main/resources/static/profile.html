<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff4400',
                        secondary: '#f5f5f5',
                        dark: '#333333',
                        light: '#666666',
                        border: '#dddddd'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 头部 -->
<header class="bg-white border-b border-border">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/taobao/index.html" class="text-primary text-xl font-bold">
            <i class="fa fa-shopping-bag mr-2"></i>返回首页
        </a>
        <h1 class="text-dark text-2xl font-bold">个人中心</h1>
        <div></div>
    </div>
</header>



<!-- 主内容 -->
<main class="container mx-auto px-4 py-8">
    <div id="loading" class="text-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
        <p class="text-light mt-4">加载中...</p>
    </div>

    <div id="content" class="hidden max-w-md mx-auto bg-white rounded-lg shadow-sm p-6">
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-dark mb-1">用户名</label>
                <input type="text" id="username" class="w-full border border-border rounded px-3 py-2 bg-gray-100" disabled>
            </div>
            <div>
                <label class="block text-sm text-dark mb-1">昵称</label>
                <input type="text" id="nickname" class="w-full border border-border rounded px-3 py-2">
            </div>



            <div>
                <label class="block text-sm text-dark mb-1">账户余额</label>
                <div class="flex space-x-2">
                    <input type="text" id="balance"
                           class="w-full border border-border rounded px-3 py-2 bg-gray-100"
                           disabled>
                    <button onclick="openRechargeModal()"
                            class="px-4 py-2 bg-green-500 text-white
                            rounded hover:bg-green-600 whitespace-nowrap">
                        <i class="fa fa-plus mr-1"></i>充值
                    </button>
                </div>
            </div>



            <!-- 充值弹窗 -->
            <div id="rechargeModal" class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center z-50 flex">
                <div class="bg-white rounded-lg p-8 w-[540px] relative shadow-lg">
                    <h2 class="text-xl font-bold text-dark mb-6">账户充值</h2>

                    <!-- 输入金额 -->
                    <div id="rechargeStep1" class="space-y-4">
                        <div>
                            <label class="block text-base text-dark mb-2">充值金额（元）</label>
                            <input type="number" id="rechargeAmount" class="w-full border border-border rounded px-4 py-3 text-lg" min="0.01" step="0.01" placeholder="请输入金额">
                        </div>
                        <div class="flex justify-end space-x-3 mt-6">
                            <button onclick="closeRechargeModal()" class="px-6 py-3 border border-border rounded-md text-base hover:bg-gray-100">取消</button>
                            <button onclick="showQRCode()" class="px-6 py-3 bg-green-500 text-white rounded-md text-base hover:bg-green-600">确认支付</button>
                        </div>
                    </div>

                    <!-- 扫码支付 -->
                    <div id="rechargeStep2" class="hidden space-y-4">
                        <p class="text-base text-dark text-center">请使用微信扫一扫支付</p>
                        <img src="/taobao/images/recharge.jpg" alt="收款码" class="max-w-full h-auto max-h-80 mx-auto border border-border rounded">
                        <p class="text-sm text-light text-center">支付完成后，请点击下方按钮</p>
                        <div class="flex justify-end space-x-3 mt-6">
                            <button onclick="closeRechargeModal()" class="px-6 py-3 border border-border rounded-md text-base hover:bg-gray-100">取消</button>
                            <button onclick="rechargeDone()" class="px-6 py-3 bg-green-500 text-white rounded-md text-base hover:bg-green-600">我已扫码支付</button>
                        </div>
                    </div>

                    <button onclick="closeRechargeModal()" class="absolute top-3 right-4 text-gray-500 hover:text-dark text-lg">
                        <i class="fa fa-close"></i>
                    </button>
                </div>
            </div>






            <div class="flex justify-end space-x-2 pt-4">
                <a href="/taobao/index.html" class="px-4 py-2 border border-border rounded hover:bg-gray-100">取消</a>
                <button onclick="saveProfile()" class="px-4 py-2 bg-primary text-white rounded hover:bg-orange-600">保存修改</button>
            </div>
        </div>
    </div>

    <div id="errorBox" class="hidden text-center py-12">
        <i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>
        <p class="text-light">加载失败，请先登录</p>
        <a href="/taobao/login.html" class="text-primary hover:underline mt-2 inline-block">去登录</a>
    </div>
</main>



<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>


    let rechargeAmountValue = 0;

    axios.defaults.baseURL = window.location.origin + '/taobao';
    let currentConsumerId = null;   // 保存当前消费者 id

    document.addEventListener('DOMContentLoaded', loadProfile);

    function loadProfile() {
        axios.get('/consumer/me')
            .then(resp => {
                document.getElementById('loading').classList.add('hidden');
                if (resp.data.code === 200) {
                    const data = resp.data.data;
                    currentConsumerId = data.id;   // 保存 id
                    document.getElementById('username').value = data.username;
                    document.getElementById('nickname').value = data.consumer_name;
                    document.getElementById('balance').value = data.account_balance;
                    document.getElementById('content').classList.remove('hidden');
                } else {
                    document.getElementById('errorBox').classList.remove('hidden');
                }
            })
            .catch(err => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('errorBox').classList.remove('hidden');
            });
    }

    function saveProfile() {
        const nickname = document.getElementById('nickname').value.trim();
        const balance = parseFloat(document.getElementById('balance').value);

        if (!nickname) {
            alert('昵称不能为空');
            return;
        }

        axios.put('/consumer/update', {
            id: currentConsumerId,                  // 必传 id
            consumer_name: nickname,
            account_balance: balance
        })
            .then(resp => {
                if (resp.data.code === 200) {
                    alert('个人信息已更新');
                    window.location.href = '/taobao/index.html';
                } else {
                    alert(resp.data.msg || '更新失败');
                }
            })
            .catch(err => {
                console.error('更新失败:', err);
                alert('更新失败，请重试');
            });
    }

    function openRechargeModal() {
        document.getElementById('rechargeModal').classList.remove('hidden');
        document.getElementById('rechargeStep1').classList.remove('hidden');
        document.getElementById('rechargeStep2').classList.add('hidden');
        document.getElementById('rechargeAmount').value = '';
    }

    function closeRechargeModal() {
        document.getElementById('rechargeModal').classList.add('hidden');
    }

    function showQRCode() {
        const amount = parseFloat(document.getElementById('rechargeAmount').value);
        if (!amount || amount <= 0) {
            alert('请输入有效的充值金额');
            return;
        }
        rechargeAmountValue = amount;
        document.getElementById('rechargeStep1').classList.add('hidden');
        document.getElementById('rechargeStep2').classList.remove('hidden');
    }

    function rechargeDone() {
        axios.post('/consumer/recharge', { amount: rechargeAmountValue })
            .then(resp => {
                if (resp.data.code === 200) {
                    alert(resp.data.msg);
                    closeRechargeModal();
                    loadProfile(); // 重新加载个人信息，刷新余额
                } else {
                    alert(resp.data.msg || '充值失败');
                }
            })
            .catch(err => {
                console.error('充值失败:', err);
                alert('充值失败，请重试');
            });
    }


</script>
</body>
</html>
