<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff4400',
                        secondary: '#f5f5f5',
                        dark: '#333333',
                        light: '#666666',
                        border: '#dddddd'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-orange-50/30 min-h-screen">

<!-- 头部 -->
<header class="bg-white border-b border-border">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">

        <a href="/taobao/index.html" class="text-primary text-xl font-bold">
            <i class="fa fa-shopping-bag mr-2"></i>返回首页
        </a>

        <h1 class="text-dark text-2xl font-bold">个人中心</h1>


        <div></div>
    </div>
</header>



<!-- 主内容 -->
<main class="container mx-auto px-4 py-8">
    <div id="loading" class="text-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
        <p class="text-light mt-4">加载中...</p>
    </div>

    <div id="content" class="hidden max-w-md mx-auto bg-white rounded-2xl shadow-lg border border-orange-100 p-10">

        <div class="space-y-6">
            <div>
                <label class="block text-sm text-dark mb-1">用户名</label>

                <input type="text" id="username" class="w-full border border-orange-200 rounded-xl px-4 py-3 bg-orange-50/30 text-gray-600" disabled>

            <div>
                <label class="block text-sm text-dark mb-1">昵称</label>


                <input type="text" id="nickname" class="w-full border border-orange-200 rounded-xl px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-300 focus:outline-none transition-colors">

            </div>


            <div class="bg-orange-50/40 rounded-xl p-4 pl-5 border-l-4 border-orange-300">
                <label class="block text-sm text-dark mb-2">账户余额</label>
                <div class="flex space-x-3">
                    <input type="text" id="balance"
                           class="w-full border border-transparent rounded-xl px-4 py-3 bg-white/80 text-gray-700 font-medium"
                           disabled>
                    <button onclick="openRechargeModal()"
                            class="px-5 py-3 bg-orange-500 text-white rounded-xl hover:bg-orange-600 transition-colors whitespace-nowrap shadow-sm">
                        <i class="fa fa-plus mr-1"></i>充值
                    </button>
                </div>
            </div>



            <!-- 充值弹窗 -->
            <div id="rechargeModal" class="fixed inset-0 bg-black bg-opacity-40 hidden justify-center items-center z-50 flex">
                <div class="bg-white rounded-lg p-8 w-[540px] relative shadow-lg">
                    <h2 class="text-xl font-bold text-dark mb-6">账户充值</h2>

                    <!-- 输入金额 -->
                    <div id="rechargeStep1" class="space-y-4">
                        <div>
                            <label class="block text-base text-dark mb-2">充值金额（元）</label>
                            <input type="number" id="rechargeAmount" class="w-full border border-border rounded px-4 py-3 text-lg" min="0.01" step="0.01" placeholder="请输入金额">
                        </div>
                        <div class="flex justify-end space-x-3 mt-6">
                            <button onclick="closeRechargeModal()" class="px-6 py-3 border border-border rounded-md text-base hover:bg-gray-100">取消</button>
                            <button onclick="showQRCode()" class="px-6 py-3 bg-green-500 text-white rounded-md text-base hover:bg-green-600">确认支付</button>
                        </div>
                    </div>



                    <!-- 扫码支付（新版：动态二维码） -->
                    <div id="rechargeStep2" class="hidden space-y-4">
                        <p class="text-base text-dark text-center">请使用沙箱支付宝扫一扫支付</p>
                        <div id="qrcodeContainer" class="flex justify-center my-4"></div>
                        <p class="text-sm text-light text-center">支付金额：<span id="payAmountDisplay"></span> 元</p>
                        <p class="text-xs text-light text-center">支付成功后自动确认</p>
                    </div>



                    <button onclick="closeRechargeModal()" class="absolute top-3 right-4 text-gray-500 hover:text-dark text-lg">
                        <i class="fa fa-close"></i>
                    </button>
                </div>
            </div>



            <div class="flex justify-end space-x-3 pt-6">

                <a href="/taobao/index.html" class="px-5 py-2.5 border border-orange-200 rounded-xl text-gray-500 hover:bg-orange-50 transition-colors">取消</a>

                <button onclick="saveProfile()" class="px-5 py-2.5 bg-orange-500 text-white rounded-xl hover:bg-orange-600 transition-colors shadow-sm">保存修改</button>
            </div>


        </div>
    </div>

    <div id="errorBox" class="hidden text-center py-12">
        <i class="fa fa-exclamation-triangle text-4xl text-orange-400 mb-4"></i>
        <p class="text-light">加载失败，请先登录</p>
        <a href="/taobao/login.html" class="text-primary hover:underline mt-2 inline-block">去登录</a>
    </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>


<script>




    axios.defaults.baseURL = window.location.origin + '/taobao';
    let currentConsumerId = null;   // 保存当前消费者 id

    document.addEventListener('DOMContentLoaded', loadProfile);

    function loadProfile() {
        axios.get('/consumer/me')
            .then(resp => {
                document.getElementById('loading').classList.add('hidden');
                if (resp.data.code === 200) {
                    const data = resp.data.data;
                    currentConsumerId = data.id;   // 保存 id
                    document.getElementById('username').value = data.username;
                    document.getElementById('nickname').value = data.consumer_name;
                    document.getElementById('balance').value = data.account_balance;
                    document.getElementById('content').classList.remove('hidden');
                } else {
                    document.getElementById('errorBox').classList.remove('hidden');
                }
            })
            .catch(err => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('errorBox').classList.remove('hidden');
            });
    }

    function saveProfile() {
        const nickname = document.getElementById('nickname').value.trim();
        const balance = parseFloat(document.getElementById('balance').value);

        if (!nickname) {
            alert('昵称不能为空');
            return;
        }

        axios.put('/consumer/update', {
            id: currentConsumerId,                  // 必传 id
            consumer_name: nickname,
            account_balance: balance
        })
            .then(resp => {
                if (resp.data.code === 200) {
                    alert('个人信息已更新');
                    window.location.href = '/taobao/index.html';
                } else {
                    alert(resp.data.msg || '更新失败');
                }
            })
            .catch(err => {
                console.error('更新失败:', err);
                alert('更新失败，请重试');
            });
    }

    function openRechargeModal() {
        document.getElementById('rechargeModal').classList.remove('hidden');
        document.getElementById('rechargeModal').classList.add('flex');
        document.getElementById('rechargeStep1').classList.remove('hidden');
        document.getElementById('rechargeStep2').classList.add('hidden');
        document.getElementById('rechargeAmount').value = '';
        document.getElementById('qrcodeContainer').innerHTML = '';  // 清理旧二维码
        if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
        currentPayOutTradeNo = null;
    }

    function closeRechargeModal() {
        if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
        document.getElementById('rechargeModal').classList.add('hidden');
        document.getElementById('rechargeModal').classList.remove('flex');
    }

    function startPolling() {
        //关掉其他定时器
        if (pollingTimer) clearInterval(pollingTimer);
        pollingTimer = setInterval(() => {
            //每两秒发请求给status确认状态
            axios.get('/alipay/status', { params: { outTradeNo: currentPayOutTradeNo } })
                .then(resp => {
                    if (resp.data.code === 200 && resp.data.data === 'SUCCESS') {
                        clearInterval(pollingTimer);
                        pollingTimer = null;
                        alert('支付成功！');
                        closeRechargeModal();
                        // 刷新余额
                        loadProfile();
                    }
                })
                .catch(err => {
                    console.error('查询支付状态失败:', err);
                });
        }, 2000);//每两秒轮询一次
    }


    let currentPayOutTradeNo = null;
    let pollingTimer = null;

    function showQRCode() {
        const amount = parseFloat(document.getElementById('rechargeAmount').value);
        if (!amount || amount <= 0) {
            alert('请输入有效的充值金额');
            return;
        }

        // 用户发起充值请求，调后端生成支付二维码(只传金额，订单由后端产生)
        axios.post('/alipay/recharge', null, { params: { amount: amount } })
            .then(resp => {
                if (resp.data.code === 200) {
                    /*
                    resp最初会返回"code": 200,"msg": "success",
                       "data": "https://qr.alipay.com/bax02025yfug6xpwmvda00bd"
                        后端会将这个变为 "订单号,data"
                     */
                    const data = resp.data.data.split(',');
                    if (data.length !== 2) {
                        alert('返回支付信息异常');
                        return;
                    }
                    //存的订单号
                    const outTradeNo = data[0];
                    //存的二维码的地址
                    const qrCodeUrl = data[1];
                    currentPayOutTradeNo = outTradeNo;

                    // 页面切换 ，显示金额，生成二维码...
                    document.getElementById('rechargeStep1').classList.add('hidden');
                    document.getElementById('rechargeStep2').classList.remove('hidden');
                    document.getElementById('payAmountDisplay').innerText = amount;

                    const container = document.getElementById('qrcodeContainer');
                    container.innerHTML = '';
                    new QRCode(container, { text: qrCodeUrl, width: 200, height: 200 });

                    // 开始轮询支付状态,支付成功后自动关闭弹窗
                    startPolling();


                } else {
                    alert(resp.data.msg || '生成支付订单失败');
                }
            })
            .catch(err => {
                console.error('充值请求失败:', err);
                alert('系统繁忙，请稍后再试');
            });
    }



</script>
</body>
</html>
