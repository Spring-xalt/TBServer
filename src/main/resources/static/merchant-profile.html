<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商户账户设置</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff6a00',
            secondary: '#f5f5f5',
            dark: '#1a1a1a',
            light: '#888888',
            border: '#e8e8e8'
          }
        }
      }
    }
  </script>
  <style>
    .profile-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      padding: 28px;
    }
    .profile-card h3 {
      font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .profile-card h3 i { color: #ff6a00; }
    .profile-input {
      width: 100%;
      border: 2px solid #f0f0f0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      transition: all 0.2s;
      background: #fafafa;
      outline: none;
    }
    .profile-input:focus { border-color: #ff6a00; background: #fff; box-shadow: 0 0 0 3px rgba(255,106,0,0.08); }
    .profile-input:disabled { background: #f5f5f5; color: #999; }
    .profile-label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-primary {
      background: linear-gradient(135deg, #ff5e62, #ff6a00);
      color: #fff; border: none; border-radius: 12px;
      padding: 12px 28px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.25s;
      box-shadow: 0 4px 12px rgba(255,94,98,0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,94,98,0.40); }
    .btn-outline {
      background: #fff; color: #ff5e62; border: 2px solid #ffcdd2;
      border-radius: 12px; padding: 12px 24px; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: all 0.25s; text-decoration: none; display: inline-block;
    }
    .btn-outline:hover { background: #fff5f0; border-color: #ff6a00; }
    .avatar-circle {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #ff5e62, #ff6a00, #ff9966);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: #fff;
      box-shadow: 0 8px 24px rgba(255,94,98,0.30);
    }
    .revenue-badge {
      background: linear-gradient(135deg, #fff5f0, #ffe8d6);
      border-radius: 14px;
      padding: 20px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .quick-link {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px; border-radius: 12px;
      background: #fafafa; text-decoration: none;
      color: #333; font-weight: 500; transition: all 0.2s;
    }
    .quick-link:hover { background: #fff5f0; color: #ff6a00; transform: translateX(4px); }
    .quick-link i { color: #ff6a00; font-size: 20px; width: 24px; text-align: center; }
  </style>
</head>
<body class="bg-orange-50/30 min-h-screen">

<header class="bg-white border-b border-border sticky top-0 z-40">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a href="/taobao/merchant-index.html" class="text-primary font-bold text-lg flex items-center gap-2 hover:text-orange-600 transition-colors">
      <i class="fa fa-arrow-left"></i> 返回商家中心
    </a>
    <h1 class="text-dark text-xl font-bold">账户设置</h1>
    <div></div>
  </div>
</header>

<main class="container mx-auto px-4 py-8">
  <div id="loading" class="text-center py-20">
    <div class="animate-spin rounded-full h-14 w-14 border-t-2 border-b-2 border-primary mx-auto"></div>
    <p class="text-light mt-4">加载中...</p>
  </div>

  <div id="errorBox" class="hidden text-center py-20">
    <i class="fa fa-exclamation-triangle text-5xl text-orange-300 mb-4 block"></i>
    <p class="text-lg text-light mb-4">加载失败，请先登录</p>
    <a href="/taobao/login.html" class="btn-primary inline-block no-underline">去登录</a>
  </div>

  <div id="content" class="hidden">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-5xl mx-auto">

      <!-- 左侧：头像 + 快捷入口 -->
      <div class="lg:col-span-1 space-y-5">
        <div class="profile-card text-center">
          <div class="avatar-circle mx-auto mb-4" id="avatarEmoji">🏪</div>
          <h2 class="text-xl font-bold text-dark" id="displayName">—</h2>
          <p class="text-light text-sm mt-1">商户</p>
        </div>

        <div class="profile-card space-y-2">
          <h3><i class="fa fa-link"></i> 快捷入口</h3>
          <a href="/taobao/merchant-index.html" class="quick-link">
            <i class="fa fa-cube"></i> 商品管理
          </a>
          <a href="/taobao/merchant-orders.html" class="quick-link">
            <i class="fa fa-list-alt"></i> 订单管理
          </a>
          <a href="/taobao/merchant-after-sale.html" class="quick-link">
            <i class="fa fa-wrench"></i> 售后管理
          </a>
          <a href="/taobao/merchant-reviews.html" class="quick-link">
            <i class="fa fa-star"></i> 店铺评价
          </a>
        </div>
      </div>

      <!-- 右侧：账户信息 -->
      <div class="lg:col-span-2 space-y-5">
        <div class="profile-card">
          <h3><i class="fa fa-user-circle"></i> 账户信息</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label class="profile-label">用户名</label>
              <input type="text" id="username" class="profile-input" disabled>
            </div>
            <div>
              <label class="profile-label">店铺名称</label>
              <input type="text" id="merchantName" class="profile-input" placeholder="输入店铺名称">
            </div>
          </div>
        </div>

        <div class="profile-card">
          <h3><i class="fa fa-cny"></i> 累计营收</h3>
          <div class="revenue-badge">
            <div>
              <span class="text-sm text-light">店铺累计营收</span>
              <div class="text-3xl font-bold text-dark mt-1" id="revenueDisplay">¥0.00</div>
            </div>
            <span class="text-sm text-light">该金额由系统自动统计</span>
          </div>
        </div>

        <div class="flex justify-end gap-3">
          <a href="/taobao/merchant-index.html" class="btn-outline">取消</a>
          <button onclick="saveProfile()" class="btn-primary">保存修改</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
  axios.defaults.baseURL = window.location.origin + '/taobao';

  document.addEventListener('DOMContentLoaded', loadProfile);

  function loadProfile() {
    axios.get('/merchant/myInfo')
      .then(function(resp) {
        document.getElementById('loading').classList.add('hidden');
        if (resp.data.code === 200) {
          var data = resp.data.data;
          document.getElementById('username').value = data.username || '';
          document.getElementById('merchantName').value = data.merchant_name || '';
          document.getElementById('revenueDisplay').textContent = '¥' + (data.revenue || 0).toFixed(2);
          var name = data.merchant_name || data.username || '商户';
          document.getElementById('displayName').textContent = name;
          document.getElementById('avatarEmoji').textContent = '🏪';
          document.getElementById('content').classList.remove('hidden');
        } else {
          document.getElementById('errorBox').classList.remove('hidden');
        }
      })
      .catch(function() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('errorBox').classList.remove('hidden');
      });
  }

  function saveProfile() {
    var merchantName = document.getElementById('merchantName').value.trim();
    if (!merchantName) { alert('店铺名称不能为空'); return; }
    axios.put('/merchant/updateInfo', null, { params: { merchantName: merchantName } })
      .then(function(resp) {
        if (resp.data.code === 200) {
          alert('店铺名称已更新');
          window.location.href = '/taobao/merchant-index.html';
        } else {
          alert(resp.data.msg || '更新失败');
        }
      })
      .catch(function() { alert('更新失败，请重试'); });
  }
</script>
</body>
</html>
