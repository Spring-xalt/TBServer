<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{primary:'#ff6a00',secondary:'#f5f5f5',dark:'#1a1a1a',light:'#888888',border:'#e8e8e8'}}}}</script>
    <style>
        .order-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); overflow: hidden; transition: all 0.2s; }
        .order-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.10); }
        .order-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: #fafafa; border-bottom: 1px solid #f0f0f0; font-size: 13px; color: #999; }
        .order-body { display: flex; align-items: center; padding: 20px 22px; gap: 18px; }
        .order-body .product-img { width: 72px; height: 72px; border-radius: 10px; background: #f5f5f5; flex-shrink: 0; object-fit: cover; border: 1px solid #f0f0f0; }
        .order-body .info { flex: 1; min-width: 0; }
        .order-body .info h3 { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
        .order-body .price { text-align: right; flex-shrink: 0; }
        .order-body .price .amount { font-size: 20px; font-weight: 700; color: #ff5e62; }
        .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 5px 14px; border-radius: 12px; font-size: 12.5px; font-weight: 600; }
        .status-1 { background: #fff7e6; color: #fa8c16; }
        .status-2 { background: #e6f7ff; color: #1890ff; }
        .status-3 { background: #f0fff4; color: #52c41a; }
        .filter-btn { padding: 10px 20px; border-radius: 22px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1.5px solid #e8e8e8; transition: all 0.2s; background: #fff; color: #666; }
        .filter-btn.active { background: linear-gradient(135deg, #ff5e62, #ff6a00); color: #fff; border-color: transparent; }
        .filter-btn:hover:not(.active) { border-color: #ff6a00; color: #ff6a00; }
    </style>
</head>
<body class="bg-orange-50/30 min-h-screen">

<header class="bg-white border-b border-border sticky top-0 z-40">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a href="/taobao/merchant-index.html" class="text-primary font-bold text-lg flex items-center gap-2 hover:text-orange-600 transition-colors">
      <i class="fa fa-arrow-left"></i> 返回商家中心
    </a>
    <h1 class="text-dark text-xl font-bold">订单管理</h1>
    <div></div>
  </div>
</header>

<main class="container mx-auto px-4 py-8">
  <div class="flex flex-wrap gap-2 mb-6">
    <button class="filter-btn active" onclick="filterOrders(0)" id="btnAll">📋 全部</button>
    <button class="filter-btn" onclick="filterOrders(1)" id="btnPending">⏳ 未支付</button>
    <button class="filter-btn" onclick="filterOrders(2)" id="btnPaid">✅ 已支付</button>
    <button class="filter-btn" onclick="filterOrders(3)" id="btnReceived">📦 已签收</button>
    <span class="ml-auto text-sm text-light self-center" id="orderCount"></span>
  </div>

  <div id="loading" class="text-center py-16 hidden">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto"></div>
    <p class="text-light mt-4">加载中...</p>
  </div>
  <div id="orderList" class="space-y-4 max-w-3xl mx-auto"></div>
  <div id="pagination" class="max-w-3xl mx-auto"></div>
  <div id="emptyState" class="hidden text-center py-16">
    <i class="fa fa-inbox text-5xl text-gray-300 mb-4 block"></i>
    <p class="text-light text-lg">暂无相关订单</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script>
  axios.defaults.baseURL = window.location.origin + '/taobao';
  var allOrders = [];
  var currentFilter = 0;
  var currentPage = 1, totalPages = 1, pageSize = 5;

  document.addEventListener('DOMContentLoaded', function() { loadOrders(1); });

  function loadOrders(page) {
    currentPage = page || 1;
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('orderList').innerHTML = '';
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('emptyState').classList.add('hidden');
    axios.get('/order/merchant/list', { params: { page: currentPage, size: pageSize } })
      .then(function(resp) {
        document.getElementById('loading').classList.add('hidden');
        if (resp.data.code === 200 && resp.data.data) {
          allOrders = resp.data.data.orders || [];
          totalPages = resp.data.data.pages || 1;
          applyFilter();
        } else {
          document.getElementById('emptyState').classList.remove('hidden');
        }
      })
      .catch(function() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
      });
  }

  function filterOrders(status) {
    currentFilter = status;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    var id = status === 0 ? 'btnAll' : status === 1 ? 'btnPending' : status === 2 ? 'btnPaid' : 'btnReceived';
    document.getElementById(id).classList.add('active');
    applyFilter();
  }

  function applyFilter() {
    var filtered = currentFilter === 0 ? allOrders : allOrders.filter(function(o) { return o.status === currentFilter; });
    document.getElementById('orderCount').textContent = '共 ' + filtered.length + ' 单';
    var listEl = document.getElementById('orderList');
    if (filtered.length === 0) { listEl.innerHTML = ''; document.getElementById('emptyState').classList.remove('hidden'); return; }
    document.getElementById('emptyState').classList.add('hidden');
    listEl.innerHTML = '';
    filtered.forEach(function(o) { listEl.appendChild(createOrderCard(o)); });
    renderPagination();
  }

  function renderPagination() {
    var c = document.getElementById('pagination');
    if (totalPages <= 1) { c.innerHTML = ''; return; }
    c.innerHTML =
      '<div class="flex items-center justify-center space-x-2 mt-6">' +
        '<button onclick="loadOrders(' + (currentPage - 1) + ')" class="px-3 py-2 border rounded-md text-sm ' + (currentPage <= 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100') + '" ' + (currentPage <= 1 ? 'disabled' : '') + '>上一页</button>' +
        '<span class="text-sm text-light">第 ' + currentPage + ' / ' + totalPages + ' 页</span>' +
        '<button onclick="loadOrders(' + (currentPage + 1) + ')" class="px-3 py-2 border rounded-md text-sm ' + (currentPage >= totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100') + '" ' + (currentPage >= totalPages ? 'disabled' : '') + '>下一页</button>' +
      '</div>';
  }

  function createOrderCard(order) {
    var stMap = { 1: { text: '⏳ 未支付', cls: 'status-1' }, 2: { text: '✅ 已支付', cls: 'status-2' }, 3: { text: '📦 已签收', cls: 'status-3' } };
    var st = stMap[order.status] || { text: '未知', cls: 'status-1' };
    var qty = order.quantity || 1;
    var unit = order.unit_price || order.total_amount || 0;
    var total = order.total_amount || 0;
    var pid = order.product_id || 0;

    var card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML =
      '<div class="order-header">' +
        '<span><i class="fa fa-file-text-o mr-1"></i>订单号 <b style="color:#555;">#' + order.id + '</b></span>' +
        '<span class="status-badge ' + st.cls + '">' + st.text + '</span>' +
      '</div>' +
      '<div class="order-body">' +
        '<img src="/taobao/product/' + pid + '/image" class="product-img" onerror="this.src=\'https://picsum.photos/seed/' + pid + '/150/150\'" alt="">' +
        '<div class="info">' +
          '<h3>' + order.product_name + '</h3>' +
          '<div style="display:flex;gap:16px;font-size:13px;color:#888;margin-top:4px;">' +
            '<span><i class="fa fa-user"></i> ' + (order.consumer_name || '买家未知') + '</span>' +
            '<span><i class="fa fa-clock-o"></i> ' + formatTime(order.create_time) + '</span>' +
          '</div>' +
          '<div style="display:flex;gap:16px;font-size:12.5px;color:#888;margin-top:6px;">' +
            '<span>单价 <b style="color:#555;">¥' + unit.toFixed(2) + '</b></span>' +
            '<span>× <b style="color:#555;">' + qty + '</b></span>' +
            '<span>实付 <b style="color:#ff5e62;font-size:14px;">¥' + total.toFixed(2) + '</b></span>' +
          '</div>' +
        '</div>' +
      '</div>';
    return card;
  }

  function formatTime(d) {
    if (!d) return '';
    var t = new Date(d);
    return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0') + ' ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  }
</script>
</body>
</html>
